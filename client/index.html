const qty=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
function corePlatform(d,owner=false){
 const systems=d?.systems||[],nodes=d?.nodes||[],works=d?.works||[],materials=d?.project_materials||[],orders=d?.purchase_orders||[],items=d?.purchase_items||[];
 const zones=new Map((d?.zones||[]).map(x=>[x.id,x]));
 const systemsById=new Map(systems.map(x=>[x.id,x]));
 const done=works.filter(x=>x.status==='done').length,delivered=materials.filter(x=>['delivered','installed'].includes(x.status)).length,total=orders.reduce((sum,x)=>sum+Number(x.total_amount||0),0);
 const systemRows=systems.map(x=>{const count=nodes.filter(n=>n.system_id===x.id).length,zone=zones.get(x.zone_id);return`<div class="coreRow"><div><b>${esc(x.name)}</b><small>${esc(coreSystem(x.system_type))}${zone?' · '+esc(zone.name):''} · ${count} узлов</small></div><span class="pill">${esc(coreStatus(x.status))}</span></div>`}).join('');
 const workRows=works.map(x=>{const system=systemsById.get(x.system_id),progress=x.status==='done'?100:(Number(x.planned_quantity)>0?Math.round(Number(x.completed_quantity||0)/Number(x.planned_quantity)*100):0);return`<div class="coreRow"><div><b>${esc(x.title)}</b><small>${system?esc(system.name)+' · ':''}${qty(x.completed_quantity)} из ${qty(x.planned_quantity)} ${esc(x.unit||'')} · ${progress}%</small></div><span class="pill">${esc(coreStatus(x.status))}</span></div>`}).join('');
 const materialRows=materials.map(x=>`<div class="coreRow"><div><b>${esc(x.name_snap)}</b><small>Нужно ${qty(x.required_quantity)} ${esc(x.unit||'')} · заказано ${qty(x.ordered_quantity)} · доставлено ${qty(x.delivered_quantity)}</small></div><span class="pill">${esc(coreStatus(x.status))}</span></div>`).join('');
 const orderRows=orders.map(x=>{const count=items.filter(i=>i.purchase_order_id===x.id).length;return`<div class="coreRow"><div><b>${esc(x.order_number||'Заказ поставщику')}</b><small>${esc(x.supplier_name||'Поставщик не указан')} · ${count} позиций${x.expected_at?' · до '+dt(x.expected_at):''}</small></div><div style="text-align:right"><b>${money(x.total_amount)}</b><small>${esc(coreStatus(x.status))}</small></div></div>`}).join('');
 return`<div class="section"><div class="sectionHead"><h2>Платформа объекта</h2><span class="platformFlag">Core v2${owner?' · управление':''}</span></div><div class="coreSummary"><div class="coreMetric"><b>${systems.length}</b><small>систем · ${nodes.length} узлов</small></div><div class="coreMetric"><b>${done}/${works.length}</b><small>работ выполнено</small></div><div class="coreMetric"><b>${delivered}/${materials.length}</b><small>материалов доставлено</small></div><div class="coreMetric"><b>${money(total)}</b><small>${orders.length} закупок</small></div></div><details class="coreModule" open><summary>Инженерные системы <span>${systems.length}</span></summary><div class="coreBody">${systemRows||'<div class="empty">Системы ещё не добавлены.</div>'}</div></details><details class="coreModule"><summary>Работы <span>${works.length}</span></summary><div class="coreBody">${workRows||'<div class="empty">Работы ещё не запланированы.</div>'}</div></details><details class="coreModule"><summary>Материалы <span>${materials.length}</span></summary><div class="coreBody">${materialRows||'<div class="empty">Материалы ещё не сформированы.</div>'}</div></details><details class="coreModule"><summary>Закупки <span>${orders.length}</span></summary><div class="coreBody">${orderRows||'<div class="empty">Закупки ещё не созданы.</div>'}</div></details></div>`;
}
function notice(t,type=''){ $('#notice').innerHTML=t?`<div class="notice ${type}">${esc(t)}</div>`:'' }
async function timedFetch(url,options={},ms=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...options,signal:c.signal})}catch(e){if(e.name==='AbortError')throw Error('Сервер не ответил вовремя. Проверьте интернет и нажмите «Повторить».');throw e}finally{clearTimeout(timer)}}
async function adminCall(action,p={},timeout=12000){const r=await timedFetch(ADMIN_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData:tg?.initData||'',portalToken:token,...p})},timeout);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function clientCall(action='',p={}){const auth=token?{token}:{initData:tg?.initData||''};const r=await timedFetch(CLIENT_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...auth,...p,...(action?{action}:{})}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||('HTTP '+r.status));e.code=d.error||'';e.payload=d;throw e}return d}
async function upload(action,file,p={}){const f=new FormData();f.append('action',action);f.append('initData',tg?.initData||'');f.append('portalToken',token);f.append('file',file);Object.entries(p).forEach(([k,v])=>f.append(k,String(v??'')));const r=await timedFetch(ADMIN_API,{method:'POST',body:f},45000);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function showShell(){ $('#startup').hidden=true;$('#shell').hidden=false;$('#tabs').hidden=false }
function shellRole(role,title,hint){const enabled=role==='admin'||role==='client';$('#shell').classList.toggle('withSide',enabled);$('#sidePanel').hidden=!enabled;if(enabled){$('#sideModeTitle').textContent=role==='admin'?'Кабинет владельца':'Кабинет заказчика';$('#desktopPageTitle').textContent=title;$('#desktopPageHint').textContent=hint}}
function tabs(items,modules=[]){$('#tabs').style.gridTemplateColumns=`repeat(${items.length},1fr)`;$('#tabs').innerHTML=items.map((x,i)=>`<button class="tab ${S.view==='v'+(i+1)?'on':''}" data-view="v${i+1}"><b>${x[0]}</b>${x[1]}</button>`).join('');$('#sideNav').innerHTML=`<div class="sideGroupLabel">Основное</div>${items.map((x,i)=>`<button class="sideLink ${S.view==='v'+(i+1)?'on':''}" data-view="v${i+1}"><b>${x[0]}</b>${x[1]}</button>`).join('')}${modules.length?`<div class="sideGroupLabel">Развитие платформы</div>${modules.map(x=>`<div class="sideModule"><b>${x[0]}</b>${x[1]}<span>${x[2]||'Далее'}</span></div>`).join('')}`:''}`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()})}
function setView(){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===S.view))}
function answerValue(k,v){if(v==null||v==='')return'Не указано';if(Array.isArray(v))return v.length?v.map(x=>answerValue(k,x)).join(', '):'Не выбрано';if(typeof v==='object')return Object.entries(v).map(([x,y])=>`${answerLabels[x]||x}: ${answerValue(x,y)}`).join('; ');const raw=String(v),canonical=k==='heatingLayout'?'heating_layout':k==='leakProtection'?'leak':k==='nodePlacement'?'placement':k;return answerValues[`${canonical}:${raw}`]||({'yes':'Да','no':'Нет','true':'Да','false':'Нет'}[raw.toLowerCase()])||raw}
function fmtAnswersHtml(a){if(!a||typeof a!=='object'||!Object.keys(a).length)return'<div class="empty">Ответов на вопросы нет.</div>';return`<dl class="answerList">${Object.entries(a).filter(([k])=>!k.startsWith('_')).map(([k,v])=>`<div class="answerRow"><dt>${esc(answerLabels[k]||k.replaceAll('_',' '))}</dt><dd>${esc(answerValue(k,v))}</dd></div>`).join('')}</dl>`}
function leadAnswers(x){const p=x?.payload||{};if(p.answers&&typeof p.answers==='object')return p.answers;const skip=new Set(['form','stage','flow_slug','submission_id','consent','page_url','referrer','submitted_at','consent_version','preferred_channel','chat_session_id']);return Object.fromEntries(Object.entries(p).filter(([k])=>!skip.has(k)))}
function leadKind(x){return x?.source==='website_chat'?'Сообщение из чата':qname(x?.quiz_type)}
function pipeline(){const a=S.data.pipeline||Object.keys(stageNames);return`<div class="pipeline">${a.map(k=>`<button class="pipe ${S.leadStage===k?'on':''}" data-pipe="${k}">${stageNames[k]} · ${(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===k).length}</button>`).join('')}</div>`}
function leadList(){const a=(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===S.leadStage);return`${pipeline()}${a.length?a.map(x=>`<button class="lead" data-lead="${x.id}"><div class="leadTop"><div><h3>${esc(x.name||x.phone||'Без имени')}</h3><p>${esc(leadKind(x))} · ${esc(x.city||'город не указан')} · ${dt(x.created_at)}</p></div><div class="leadValue">${x.estimated_value?money(x.estimated_value):''}</div></div><div class="leadMeta"><span>${esc(sourceNames[x.source]||'Источник не указан')}</span><span>${esc(x.phone||'без телефона')}</span>${x.next_action_at?`<span>Следующее действие: ${dt(x.next_action_at)}</span>`:''}${x.project_id?'<span>Объект уже создан</span>':''}</div></button>`).join(''):'<div class="empty">В этой колонке лидов нет.</div>'}`}
function leadDetail(){const x=S.lead;if(!x)return leadList();const answers=leadAnswers(x),isChat=x.source==='website_chat';return`<button class="back" data-lead-back>← Все обращения</button><div class="hero"><div class="eyebrow">Заявка #${x.id} · ${esc(stageNames[x.pipeline_stage]||x.pipeline_stage)}</div><h1>${esc(x.name||'Клиент')}</h1><p>${esc(leadKind(x))} · ${esc(sourceNames[x.source]||'Источник не указан')}</p><div class="chips"><a class="chip" href="tel:${esc(x.phone||'')}">${esc(x.phone||'Без телефона')}</a>${x.city?`<span class="chip">${esc(x.city)}</span>`:''}</div></div><div class="sectionHead"><h2>${isChat?'Сообщение клиента':'Ответы на вопросы'}</h2><span>${dt(x.created_at)}</span></div>${isChat?`<div class="card">${esc(x.comment||'Сообщение не указано')}</div>`:fmtAnswersHtml(answers)}${x.comment&&!isChat?`<div class="section"><div class="label">Комментарий клиента</div><div class="card">${esc(x.comment)}</div></div>`:''}<div class="section"><div class="sectionHead"><h2>Работа с заявкой</h2></div><div class="card form"><div><div class="label">Этап воронки</div><select class="input" id="leadStage">${Object.entries(stageNames).map(([k,v])=>`<option value="${k}" ${x.pipeline_stage===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form2"><div><div class="label">Потенциал сделки</div><input class="input" id="leadValue" inputmode="decimal" value="${esc(x.estimated_value||'')}" placeholder="₽"></div><div><div class="label">Следующее действие</div><input class="input" id="leadNext" type="datetime-local" value="${x.next_action_at?new Date(x.next_action_at).toISOString().slice(0,16):''}"></div></div><div><div class="label">Мои заметки</div><textarea class="input" id="leadNotes" placeholder="Что обсуждали, что отправить, когда перезвонить">${esc(x.admin_notes||'')}</textarea></div><button class="btn navy w100" id="saveLead">Сохранить заявку</button>${x.project_id?`<button class="btn gold w100" data-open-project="${x.project_id}">Открыть объект</button>`:`<button class="btn gold w100" id="convertLead">Создать объект из заявки</button>`}<button class="btn red w100" id="deleteLead">Удалить заявку навсегда</button></div></div>`}
function accessQueue(){const all=S.data.access_requests||[],pending=all.filter(x=>x.status==='pending'),approved=all.filter(x=>x.status==='approved');const card=x=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' ')||'Без имени',username=x.telegram_username?'@'+x.telegram_username:'username не указан';return`<div class="accessCard"><div class="accessTop"><div><h3>${esc(name)}</h3><p>${esc(username)} · ${esc(x.phone||'телефон не указан')}<br>Запрос: ${dt(x.requested_at)}</p></div><span class="pill ${x.status==='pending'?'gold':x.status==='approved'?'green':'red'}">${x.status==='pending'?'Ожидает':x.status==='approved'?'Разрешён':x.status==='rejected'?'Отклонён':'Отозван'}</span></div><div class="accessActions">${x.status==='pending'? `<button class="btn gold" data-access-review="${x.id}" data-access-status="approved">Разрешить</button><button class="btn red" data-access-review="${x.id}" data-access-status="rejected">Отклонить</button>` : x.status==='approved'? `<button class="btn red" data-access-review="${x.id}" data-access-status="revoked">Отозвать доступ</button>` : `<button class="btn light" data-access-review="${x.id}" data-access-status="approved">Разрешить</button>`}</div></div>`};return`<div class="section"><div class="sectionHead"><h2>Доступ к Mini App</h2><span>Закрытый режим · ждут: ${pending.length}</span></div>${pending.length?pending.map(card).join(''):'<div class="empty">Новых запросов на доступ нет.</div>'}${approved.length?`<details style="margin-top:8px"><summary class="btn light w100">Разрешённые пользователи · ${approved.length}</summary><div style="margin-top:8px">${approved.map(card).join('')}</div></details>`:''}</div>`}
function adminLeads(){const leads=S.data.leads||[],projects=S.data.projects||[],requests=S.data.access_requests||[],fresh=leads.filter(x=>(x.pipeline_stage||'new')==='new').length,pending=requests.filter(x=>x.status==='pending').length;return`<div class="hero"><div class="eyebrow"><span class="liveDot"></span> Личный кабинет владельца</div><h1>Работа с проектами</h1><p>Заявки, объекты, этапы, документы, фото и оплаты — в том же интерфейсе, который видит клиент.</p></div><div class="grid g2"><div class="metric"><small>Ждут доступа</small><b>${pending}</b></div><div class="metric"><small>Новые заявки</small><b>${fresh}</b></div><div class="metric"><small>Все заявки</small><b>${leads.length}</b></div><div class="metric"><small>Объекты</small><b>${projects.length}</b></div></div>${accessQueue()}${S.lead?leadDetail():`<div class="section"><div class="sectionHead"><h2>Лиды и обращения</h2><span>${leads.length}</span></div>${leadList()}</div>`}`}

function docsAdmin(a){return`<div class="card form"><div><div class="label">Файл документа</div><input class="input fileInput" type="file" id="docFile" accept=".pdf,.xlsx,.xls,.docx,.doc,.csv"></div><div class="form2"><input class="input" id="docTitle" placeholder="Название документа"><select class="input" id="docType"><option value="project">Проект</option><option value="estimate">Смета</option><option value="proposal">КП</option><option value="contract">Договор</option><option value="act">Акт</option><option value="invoice">Счёт</option><option value="receipt">Чек</option><option value="specification">Спецификация</option><option value="other">Другое</option></select></div>${visSwitch()}<button class="btn navy w100" id="uploadDoc">Загрузить документ</button></div><div class="sectionHead" style="margin-top:10px"><h2>Документы этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><button class="btn light vis" data-entity="document" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div>`).join(''):'<div class="empty">Документов на этом этапе нет.</div>'}`}
function payAdmin(a){return`<div class="card form"><div class="form2"><div><div class="label">Сумма</div><input class="input" id="payAmount" inputmode="decimal" placeholder="₽"></div><div><div class="label">Срок оплаты</div><input class="input" id="payDue" type="date"></div></div><input class="input" id="payNote" placeholder="Например: аванс за этап монтажа"><select class="input" id="payStatus"><option value="planned">Запланировано</option><option value="requested">Запрошено</option><option value="paid">Оплачено</option></select><button class="btn navy w100" id="addPay">Добавить этап оплаты</button></div><div class="sectionHead" style="margin-top:10px"><h2>Оплаты этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||x.payment_type||'')} · ${dt(x.paid_at||x.due_date||x.created_at)}</small></div><div style="display:flex;gap:5px;align-items:center"><span class="pill">${esc(st(x.status))}</span>${x.status!=='paid'?`<button class="btn light markPaid" data-id="${x.id}">Оплачено</button>`:''}</div></div>`).join(''):'<div class="empty">Оплат на этом этапе нет.</div>'}`}
function estimateAdmin(a){return`<div class="card form"><input class="input" id="estTitle" value="Смета по этапу" placeholder="Название сметы"><div class="form3"><div><div class="label">Материалы</div><input class="input" id="estMaterials" inputmode="decimal" placeholder="₽"></div><div><div class="label">Работы</div><input class="input" id="estLabor" inputmode="decimal" placeholder="₽"></div><div><div class="label">Оборудование</div><input class="input" id="estEquipment" inputmode="decimal" placeholder="₽"></div></div><div class="form2"><div><div class="label">Скидка</div><input class="input" id="estDiscount" inputmode="decimal" placeholder="₽"></div><select class="input" id="estStatus"><option value="draft">Черновик</option><option value="issued">Опубликована</option></select></div>${visSwitch()}<button class="btn navy w100" id="addEst">Сохранить смету</button><div style="font-size:12px;color:var(--muted);line-height:1.45">Для запуска суммы вводятся укрупнённо. Позже позиции будут формироваться автоматически из материалов и работ.</div></div><div class="sectionHead" style="margin-top:10px"><h2>Сметы этого этапа</h2></div>${a.length?a.map(x=>{const t=Number(x.labor_total||0)+Number(x.mat_total||0)+Number(x.equipment_total||0)-Number(x.discount_total||0);return`<div class="row"><div><strong>${esc(x.title)}</strong><small>Материалы ${money(x.mat_total)} · работы ${money(x.labor_total)} · v${x.version||1}</small><div class="chips"><span class="pill">${esc(st(x.status))}</span><span class="pill">${x.visibility==='client'?'Клиент видит':'Только команда'}</span></div></div><div style="text-align:right"><b>${money(t)}</b><div class="actionBar"><button class="btn light estimateStatus" data-id="${x.id}" data-status="${x.status==='issued'?'draft':'issued'}">${x.status==='issued'?'В черновик':'Опубликовать'}</button><button class="btn light vis" data-entity="estimate" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div></div></div>`}).join(''):'<div class="empty">Смет на этом этапе нет.</div>'}`}
function approvalAdmin(a){return`<div class="card form"><div class="form2"><input class="input" id="approvalTitle" placeholder="Что нужно согласовать"><select class="input" id="approvalType"><option value="work">Работы</option><option value="purchase">Закупка</option><option value="estimate">Смета</option><option value="change">Изменение решения</option></select></div><textarea class="input" id="approvalDescription" placeholder="Что изменится, почему это нужно и какой результат получит заказчик"></textarea><input class="input" id="approvalAmount" inputmode="decimal" placeholder="Сумма, если применимо"><button class="btn navy w100" id="createApproval">Отправить клиенту на согласование</button></div><div class="sectionHead" style="margin-top:10px"><h2>История решений</h2></div>${a.length?a.map(x=>`<div class="approvalCard ${esc(x.status)}"><div class="leadTop"><div><strong>${esc(x.title)}</strong><small>${esc(x.description||x.approval_type)} · ${dt(x.created_at)}</small></div>${x.amount?`<b>${money(x.amount)}</b>`:''}</div><span class="pill ${x.status==='approved'?'green':x.status==='rejected'?'red':'gold'}">${esc(st(x.status))}</span></div>`).join(''):'<div class="empty">Согласований пока нет.</div>'}`}
function projectDetail(){const d=S.project;if(!d)return projectList();const p=d.project,src=p.source_data||{},stages=d.stages||[];if(S.stageId&&!stages.some(x=>x.id===S.stageId))S.stageId='';return`<button class="back" data-project-back>← Все объекты</button><div class="hero"><div class="eyebrow">Объект · ${esc(st(p.status))}</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||'')} · ${Number(p.progress_percent||0)}%</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}${d.client?`<span class="chip">${esc([d.client.first_name,d.client.last_name].filter(Boolean).join(' '))}</span>`:''}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="card form"><div class="form2"><input class="input" id="pTitle" value="${esc(p.title)}" placeholder="Название"><select class="input" id="pStatus">${Object.entries(pStatus).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form3"><input class="input" id="pCity" value="${esc(p.city||'')}" placeholder="Город"><input class="input" id="pArea" inputmode="decimal" value="${esc(p.area_m2||'')}" placeholder="м²"><input class="input" id="pProgress" inputmode="numeric" value="${esc(p.progress_percent||0)}" placeholder="%"></div><input class="input" id="pAddress" value="${esc(p.address||'')}" placeholder="Адрес"><div class="form2"><input class="input" id="pStage" value="${esc(p.current_stage||'')}" placeholder="Текущий этап"><input class="input" id="pBudget" inputmode="decimal" value="${esc(p.budget_estimate||'')}" placeholder="Бюджет ₽"></div><button class="btn navy w100" id="saveProject">Сохранить объект</button></div>${src.lead_id?`<div class="section"><div class="sectionHead"><h2>Ответы клиента</h2><span>из заявки #${src.lead_id}</span></div>${fmtAnswersHtml(src.answers||src.payload?.answers||{})}</div>`:''}<div class="section"><div class="sectionHead"><h2>Этапы работ</h2><button class="btn light" id="newStage">＋ Этап</button></div>${stages.length?stages.map(s=>`<div class="stageCard ${S.stageId===s.id?'active':''}"><div class="stageTop"><div><h3>${esc(s.name)}</h3><p>${esc(s.system||'')} · ${s.planned_finish?'до '+dt(s.planned_finish):'срок не задан'}</p></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div><div class="stageActions"><button class="btn ${S.stageId===s.id?'gold':'light'}" data-stage-select="${s.id}">${S.stageId===s.id?'Выбран':'Управлять'}</button><button class="btn light" data-stage-edit="${s.id}">Изменить</button><span class="pill">${esc(st(s.status))}</span>${s.budget_amount?`<span class="pill">${money(s.budget_amount)}</span>`:''}</div></div>`).join(''):'<div class="empty">Этапов пока нет.</div>'}</div>${corePlatform(d,true)}${objectAssets(d)}<div class="dangerZone"><h2>Удаление ошибочного объекта</h2><p>Объект, его этапы, оплаты, документы и фото будут удалены навсегда. Связанные заявки и ответы квиза сохранятся без привязки к объекту.</p><button class="btn red w100" id="deleteProject">Удалить объект навсегда</button></div>`}
function adminObjects(){return S.project?projectDetail():projectList()}
function adminTeam(){const team=S.data.team||[],installers=S.data.installers||[],roles={owner:'Владелец',foreman:'Прораб',installer:'Монтажник',procurement:'Снабжение',viewer:'Наблюдатель'};const initials=n=>String(n||'М').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();return`<div class="viewIntro"><div><div class="eyebrow">Люди и доступ</div><h1>Монтажники</h1><p>Состав команды, специализации и роли в проектах.</p></div><span class="chip">${Math.max(team.length,installers.length)} человек</span></div><div class="crewGrid">${team.length?team.map(m=>{const n=[m.user?.first_name,m.user?.last_name].filter(Boolean).join(' ')||m.user?.telegram_username||'Участник';return`<div class="crewCard"><div class="crewAvatar">${esc(initials(n))}</div><strong>${esc(n)}</strong><p>${esc(roles[m.role]||m.role||'Монтажник')} · ${esc(st(m.status))}</p><div class="chips"><span class="chip">${esc(m.user?.phone||'телефон не указан')}</span></div><div class="form2"><select class="input memberRole" data-user="${m.user_id}">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v}</option>`).join('')}</select><button class="btn light saveMemberRole" data-user="${m.user_id}">Сохранить роль</button></div></div>`}).join(''):installers.map(i=>`<div class="crewCard"><div class="crewAvatar">${esc(initials(i.name))}</div><strong>${esc(i.name||'Монтажник')}</strong><p>${esc(i.level||'специалист')} · ${esc((i.specialties||[]).join(', ')||'инженерные работы')}</p><div class="chips"><span class="chip">${esc(i.city||'город не указан')}</span>${i.rating?`<span class="chip">★ ${i.rating}</span>`:''}</div></div>`).join('')}</div>${!team.length&&!installers.length?'<div class="empty">Команда появится после добавления участников организации.</div>':''}<div class="section"><div class="sectionHead"><h2>Роли на платформе</h2><span>Права по зоне ответственности</span></div><div class="summaryStrip"><div class="statusCard"><small>Владелец</small><strong>Полный доступ</strong></div><div class="statusCard blue"><small>Прораб</small><strong>Объекты и задачи</strong></div><div class="statusCard"><small>Монтажник</small><strong>Назначенные работы</strong></div><div class="statusCard blue"><small>Снабжение</small><strong>Закупки и доставки</strong></div></div></div>`}
function adminTasks(){const tasks=S.data.tasks||[],projects=S.data.projects||[],team=S.data.team||[];const projectName=id=>projects.find(p=>p.id===id)?.title||'Объект';const cards=status=>tasks.filter(t=>(t.status||'new')===status).map(t=>`<div class="taskCard ${esc(t.priority||'')}"><strong>${esc(t.title)}</strong><small>${esc(projectName(t.project_id))}${t.due_at?' · до '+dt(t.due_at):''}</small><div class="chips"><span class="chip">${esc(st(t.priority||'normal'))}</span></div><div class="actionBar">${status!=='in_progress'&&status!=='done'?`<button class="btn light taskMove" data-task="${t.id}" data-status="in_progress">В работу</button>`:''}${status!=='done'?`<button class="btn light taskMove" data-task="${t.id}" data-status="done">Готово</button>`:''}</div></div>`).join('');return`<div class="viewIntro"><div><div class="eyebrow">Операционный центр</div><h1>Задачи</h1><p>План работ монтажников по всем объектам.</p></div><span class="chip">${tasks.length} задач</span></div><details class="coreModule createPanel"><summary>＋ Поставить задачу <span>NEW</span></summary><div class="coreBody"><div class="form"><input class="input" id="taskTitle" placeholder="Что нужно сделать"><div class="form2"><select class="input" id="taskProject">${projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><select class="input" id="taskAssignee"><option value="">Без исполнителя</option>${team.map(m=>`<option value="${m.user_id}">${esc([m.user?.first_name,m.user?.last_name].filter(Boolean).join(' ')||m.user?.telegram_username||m.role)}</option>`).join('')}</select></div><div class="form2"><input class="input" id="taskDue" type="datetime-local"><select class="input" id="taskPriority"><option value="normal">Обычный приоритет</option><option value="high">Высокий</option><option value="urgent">Срочный</option><option value="low">Низкий</option></select></div><textarea class="input" id="taskDescription" placeholder="Описание и результат"></textarea><button class="btn navy" id="createTask">Создать задачу</button></div></div></details><div class="board"><div class="boardCol"><div class="boardTitle"><b>К выполнению</b><span>${tasks.filter(t=>!['in_progress','done'].includes(t.status)).length}</span></div>${cards('new')}${cards('planned')||''}</div><div class="boardCol"><div class="boardTitle"><b>В работе</b><span>${tasks.filter(t=>t.status==='in_progress').length}</span></div>${cards('in_progress')||'<div class="empty">Нет задач</div>'}</div><div class="boardCol"><div class="boardTitle"><b>Готово</b><span>${tasks.filter(t=>t.status==='done').length}</span></div>${cards('done')||'<div class="empty">Нет задач</div>'}</div></div>`}
function adminPurchases(){const orders=S.data.purchase_orders||[],projects=S.data.projects||[],projectName=id=>projects.find(p=>p.id===id)?.title||'Объект',total=orders.reduce((s,x)=>s+Number(x.total_amount||0),0),next={draft:['submitted','Отправить'],submitted:['confirmed','Подтвердить'],confirmed:['delivered','Доставлено']};return`<div class="viewIntro"><div><div class="eyebrow">Снабжение объектов</div><h1>Закупки</h1><p>Заказы поставщикам, суммы и ожидаемые даты доставки.</p></div><span class="chip">${money(total)}</span></div><details class="coreModule createPanel"><summary>＋ Новый заказ <span>NEW</span></summary><div class="coreBody"><div class="form"><div class="form2"><select class="input" id="purchaseProject">${projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><input class="input" id="purchaseSupplier" placeholder="Поставщик"></div><div class="form3"><input class="input" id="purchaseNumber" placeholder="Номер заказа"><input class="input" id="purchaseTotal" inputmode="decimal" placeholder="Сумма, ₽"><input class="input" id="purchaseExpected" type="date"></div><button class="btn navy" id="createPurchase">Создать заказ</button></div></div></details>${orders.length?orders.map(o=>`<div class="purchaseCard"><div><b>${esc(o.order_number||'Заказ поставщику')}</b><p>${esc(o.supplier_name||'Поставщик не указан')} · ${esc(projectName(o.project_id))}${o.expected_at?' · доставка '+dt(o.expected_at):''}</p><div class="chips"><span class="pill">${esc(st(o.status))}</span></div></div><div style="text-align:right"><strong>${money(o.total_amount)}</strong>${next[o.status]?`<button class="btn light purchaseMove" data-id="${o.id}" data-status="${next[o.status][0]}" style="display:block;margin-top:8px">${next[o.status][1]}</button>`:''}</div></div>`).join(''):'<div class="empty">Закупок пока нет.</div>'}`}
function adminProfile(){const a=S.data.admin||{};return`<div class="hero"><div class="eyebrow"><span class="liveDot"></span> Профиль владельца</div><h1>${esc(a.display_name||'Владелец')}</h1><p>Полный доступ к тем же объектам, этапам и материалам, которые публикуются клиентам.</p></div><div class="card profile"><p class="verified">✓ Доступ подтверждён через Telegram</p><p>Заявки → объекты → этапы → сметы → оплаты → документы → фотоотчёты.</p><div class="securityNote">Секретные ключи и права администратора не передаются в браузер.</div></div>`}
function renderAdmin(){const titles={v1:['CRM','Воронка продаж и доступы'],v2:['Объекты','Этапы, сметы и производство'],v3:['Монтажники','Команда и роли'],v4:['Задачи','Операционный план работ'],v5:['Закупки','Снабжение и доставки']},ctx=titles[S.view]||titles.v1;shellRole('admin',ctx[0],ctx[1]);$('#modeTitle').textContent='Кабинет владельца';$('#v1').innerHTML=adminLeads();$('#v2').innerHTML=adminObjects();$('#v3').innerHTML=adminTeam();$('#v4').innerHTML=adminTasks();$('#v5').innerHTML=adminPurchases();setView();tabs([['◎','CRM'],['🏗','Объекты'],['👥','Команда'],['✓','Задачи'],['▤','Закупки']]);bindAdmin() }
async function reloadAdmin(keep=true){const d=await adminCall('bootstrap');S.data=d;if(!keep){S.lead=null;S.project=null;S.stageId=''}renderAdmin()}
async function openProject(id){notice('Загружаю объект…');S.project=await adminCall('project.detail',{project_id:id});S.stageId=S.project.stages?.[0]?.id||'';S.view='v2';notice('');renderAdmin()}
function bindAdmin(){document.querySelectorAll('[data-access-review]').forEach(b=>b.onclick=async()=>{const status=b.dataset.accessStatus,label=status==='approved'?'разрешить доступ':status==='rejected'?'отклонить запрос':'отозвать доступ';if(status!=='approved'&&!confirm('Точно '+label+'?'))return;b.disabled=true;try{await adminCall('access.review',{request_id:b.dataset.accessReview,status});notice(status==='approved'?'Доступ подтверждён':'Решение сохранено','ok');await reloadAdmin()}catch(x){notice(x.message,'error');b.disabled=false}});document.querySelectorAll('[data-pipe]').forEach(b=>b.onclick=()=>{S.leadStage=b.dataset.pipe;S.lead=null;renderAdmin()});document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{S.lead=(S.data.leads||[]).find(x=>String(x.id)===String(b.dataset.lead));renderAdmin()});document.querySelector('[data-lead-back]')?.addEventListener('click',()=>{S.lead=null;renderAdmin()});document.querySelectorAll('[data-open-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.openProject));document.querySelector('[data-project-back]')?.addEventListener('click',()=>{S.project=null;S.stageId='';renderAdmin()});
 $('#saveLead')?.addEventListener('click',async e=>{e.target.disabled=true;try{const next=$('#leadNext').value;await adminCall('lead.update',{lead_id:S.lead.id,pipeline_stage:$('#leadStage').value,estimated_value:$('#leadValue').value,admin_notes:$('#leadNotes').value,next_action_at:next?new Date(next).toISOString():null});notice('Лид сохранён','ok');const id=S.lead.id;await reloadAdmin();S.lead=(S.data.leads||[]).find(x=>x.id===id);renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#deleteLead')?.addEventListener('click',async e=>{const name=S.lead?.name||S.lead?.phone||('заявка #'+S.lead?.id);if(!confirm('Удалить заявку «'+name+'» навсегда? Объект, если он уже создан, останется.'))return;e.target.disabled=true;try{await adminCall('lead.delete',{lead_id:S.lead.id});S.lead=null;notice('Заявка удалена','ok');await reloadAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#convertLead')?.addEventListener('click',async e=>{if(!confirm('Создать объект и привязать к нему данные этого квиза?'))return;e.target.disabled=true;try{const d=await adminCall('lead.convert',{lead_id:S.lead.id});notice('Объект создан из лида','ok');await reloadAdmin();S.project=d;S.lead=null;S.view='v2';S.stageId=d.stages?.[0]?.id||'';renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});

function cp(){return S.data?.projects?.[S.clientProject]||null}function clientSelect(){const a=S.data?.projects||[];if(a.length<2)return'';return`<select class="input" id="cpSel" style="margin-top:10px">${a.map((x,i)=>`<option value="${i}" ${i===S.clientProject?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}
function clientStages(p){const stages=p?.stages||[];if(!stages.length)return'<div class="empty">Этапы появятся после планирования.</div>';return stages.map(s=>{const docs=(p.documents||[]).filter(x=>x.stage_id===s.id),media=(p.media||[]).filter(x=>x.stage_id===s.id),pay=(p.payments||[]).filter(x=>x.stage_id===s.id),est=(p.estimates||[]).filter(x=>x.stage_id===s.id);return`<details class="clientStage" ${s.status==='in_progress'?'open':''}><summary><div class="stageSummary"><div class="stageSummaryTop"><div><b>${esc(s.name)}</b><small>${esc(s.description||s.system||'')}${s.planned_finish?' · до '+dt(s.planned_finish):''}</small></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div></div></summary><div class="stageBody">${est.length?`<h4>Сметы</h4>${est.map(e=>{const t=Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0);return`<div class="row"><div><strong>${esc(e.title)}</strong><small>v${e.version||1}</small></div><b>${money(t)}</b></div>`}).join('')}`:''}${pay.length?`<h4>Оплаты</h4>${pay.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||'')} · ${dt(x.paid_at||x.due_date)}</small></div><span class="pill">${esc(st(x.status))}</span></div>`).join('')}`:''}${docs.length?`<h4>Документы</h4>${docs.map(x=>`<a class="row link" ${x.url?`href="${esc(x.url)}" target="_blank"`:''}><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><span class="pill">${x.url?'Открыть':esc(st(x.status))}</span></a>`).join('')}`:''}${media.length?`<h4>Фотоотчёт</h4><div class="thumbGrid clientPhotos">${media.filter(x=>x.url).map(x=>`<a class="photo" href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" loading="lazy">${x.caption?`<div class="photoCap">${esc(x.caption)}</div>`:''}</a>`).join('')}</div>`:''}${!est.length&&!pay.length&&!docs.length&&!media.length?'<div class="empty">Материалы по этапу ещё не опубликованы.</div>':''}</div></details>`}).join('')}

function clientObject(){const p=cp(),quizzes=S.data?.quizzes||[];if(!p){const waiting=quizzes.some(x=>!x.project_id);return`<div class="hero"><div class="eyebrow">Личный кабинет заказчика</div><h1>${waiting?'Объект готовится':'Объектов пока нет'}</h1><p>${waiting?'Исходные данные получены. После создания объекта здесь появятся смета, график, фото и согласования.':'Начните с предварительного расчёта в Telegram-боте.'}</p></div>${quizLauncher()}`};const stages=p.stages||[],current=stages.find(x=>x.status==='in_progress')||stages.find(x=>x.progress_percent>0&&x.progress_percent<100)||stages[0],pending=(p.approvals||[]).filter(x=>x.status==='pending').length,photos=(p.media||[]).length;return`<div class="hero"><div class="eyebrow"><span class="liveDot"></span> Мой объект · данные обновляются</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||st(p.status))}</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}<span class="chip">${esc(st(p.status))}</span></div>${clientSelect()}<div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="grid g3"><div class="metric"><small>Готовность</small><b>${p.progress_percent||0}%</b></div><div class="metric"><small>Оплачено</small><b>${p.paid_amount?money(p.paid_amount):'0 ₽'}</b></div><div class="metric"><small>На согласовании</small><b>${pending}</b></div></div><div class="section"><div class="sectionHead"><h2>Сейчас на объекте</h2><span>${current?esc(st(current.status)):'Планирование'}</span></div>${current?`<div class="statusCard"><small>Текущий этап</small><strong>${esc(current.name)}</strong><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(current.progress_percent||0)))}%"></i></div><small>${Number(current.progress_percent||0)}%${current.planned_finish?' · план до '+dt(current.planned_finish):''}</small></div>`:'<div class="empty">Этапы появятся после утверждения п function clientGantt(){const p=cp();if(!p)return'<div class="empty">Нет объекта для отображения графика.</div>';const a=p.stages||[];if(!a.length)return'<div class="empty">Календарный план ещё не опубликован.</div>';const dates=a.flatMap(x=>[x.planned_start,x.planned_finish].filter(Boolean).map(v=>new Date(v).getTime())),base=dates.length?Math.min(...dates):Date.now(),end=dates.length?Math.max(...dates):base+90*864e5,span=Math.max(end-base,30*864e5),months=Array.from({length:6},(_,i)=>new Date(base+span*i/5).toLocaleDateString('ru-RU',{month:'short',day:'numeric'}));const row=(s,i)=>{const from=s.planned_start?new Date(s.planned_start).getTime():base+span*i/Math.max(a.length,1),to=s.planned_finish?new Date(s.planned_finish).getTime():from+span/Math.max(a.length,1),left=Math.max(0,Math.min(94,(from-base)/span*100)),width=Math.max(6,Math.min(100-left,(to-from)/span*100));return`<div class="ganttRow"><div class="ganttName"><b>${esc(s.name)}</b><small>${dt(s.planned_start)} — ${dt(s.planned_finish)} · ${Number(s.progress_percent||0)}%</small></div><div class="ganttTrack"><div class="ganttBar ${s.status==='done'?'done':s.status==='in_progress'?'active':''}" style="left:${left}%;width:${width}%">${esc(st(s.status))}</div></div></div>`};return`<div class="viewIntro"><div><div class="eyebrow">Календарный план</div><h1>График работ</h1><p>Плановые сроки и фактическая готовность каждого этапа.</p></div><span class="chip">${p.progress_percent||0}% готово</span></div><div class="gantt"><div class="ganttHead"><div class="ganttName">Этап</div><div class="ganttScale">${months.map(x=>`<span>${x}</span>`).join('')}</div></div>${a.map(row).join('')}</div>`}
function clientEstimate(){const p=cp();if(!p)return'<div class="empty">Нет объекта.</div>';const est=p.estimates||[],pay=p.payments||[],stages=new Map((p.stages||[]).map(x=>[x.id,x])),estimateTotal=est.reduce((s,e)=>s+Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0),0),paid=pay.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount||0),0),planned=pay.reduce((s,x)=>s+Number(x.amount||0),0);return`<div class="viewIntro"><div><div class="eyebrow">Финансы объекта</div><h1>Смета и оплаты</h1><p>Оплата привязана к выполнению этапов.</p></div><span class="chip">${pay.filter(x=>x.status==='paid').length}/${pay.length} оплачено</span></div><div class="estimateHero"><div class="estimateTotal"><small>Утверждённый объём</small><b>${money(estimateTotal||p.budget_estimate||planned)}</b><div class="bar"><i style="width:${planned?Math.min(100,paid/planned*100):0}%"></i></div><small>Оплачено ${money(paid)} · осталось ${money(Math.max(0,(planned||estimateTotal||p.budget_estimate||0)-paid))}</small></div></div><div class="section"><div class="sectionHead"><h2>График платежей</h2><span>По этапам выполнения</span></div>${pay.length?pay.map((x,i)=>`<div class="paymentLine"><div class="paymentIndex">${String(i+1).padStart(2,'0')}</div><div><strong>${esc(x.note||stages.get(x.stage_id)?.name||'Оплата по объекту')}</strong><small>${x.due_date?'до '+dt(x.due_date):'срок уточняется'} · ${esc(st(x.status))}</small></div><b>${money(x.amount)}</b></div>`).join(''):'<div class="empty">График платежей появится после публикации сметы.</div>'}</div><div class="section"><div class="sectionHead"><h2>Опубликованные сметы</h2><span>${est.length}</span></div>${est.length?est.map(e=>{const t=Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0),doc=(p.documents||[]).find(d=>d.id===e.pdf_document_id);return`<${doc?.url?'a':'div'} class="row link" ${doc?.url?`href="${esc(doc.url)}" target="_blank"`:''}><div><strong>${esc(e.title)}</strong><small>Материалы ${money(e.mat_total)} · работы ${money(e.labor_total)}${Number(e.equipment_total||0)?' · оборудование '+money(e.equipment_total):''}${Number(e.discount_total||0)?' · скидка '+money(e.discount_total):''}</small><small>Версия ${e.version||1} · ${dt(e.updated_at)}</small></div><div style="text-align:right"><b>${money(t)}</b><small>${doc?.url?'Открыть PDF':esc(st(e.status))}</small></div></${doc?.url?'a':'div'}>`}).join(''):'<div class="empty">Смета ещё не опубликована.</div>'}</div>`}
function clientPhotos(){const p=cp();if(!p)return'<div class="empty">Нет объекта.</div>';const stages=p.stages||[],media=p.media||[],groups=[...stages.map(s=>({name:s.name,items:media.filter(x=>x.stage_id===s.id)})),{name:'Общие фотографии',items:media.filter(x=>!x.stage_id)}].filter(g=>g.items.length);return`<div class="viewIntro"><div><div class="eyebrow">Контроль качества</div><h1>Скрытые работы</h1><p>Фотофиксация до закрытия конструкций и отделки.</p></div><span class="chip">${media.length} фото</span></div>${groups.length?groups.map(g=>`<div class="mediaStage"><h3>${esc(g.name)} · ${g.items.length}</h3><div class="thumbGrid clientPhotos">${g.items.map(x=>`<a class="photo" href="${esc(x.url||'#')}" target="_blank"><img src="${esc(x.url||'')}" loading="lazy"><div class="photoMeta">${dt(x.created_at)}</div>${x.caption?`<div class="photoCap">${esc(x.caption)}</div>`:''}</a>`).join('')}</div></div>`).join(''):'<div class="empty">Фотоотчёт ещё не опубликован.</div>'}`}
function clientApprovals(){const p=cp();if(!p)return'<div class="empty">Нет объекта.</div>';const a=p.approvals||[];return`<div class="viewIntro"><div><div class="eyebrow">Решения заказчика</div><h1>Согласования</h1><p>Работы, материалы и закупки, требующие вашего решения.</p></div><span class="chip">${a.filter(x=>x.status==='pending').length} ожидают</span></div>${a.length?a.map(x=>`<div class="approvalCard ${esc(x.status)}"><div class="leadTop"><div><strong>${esc(x.title)}</strong><small>${esc(x.description||x.approval_type||'')} · ${dt(x.created_at)}</small></div>${x.amount?`<b>${money(x.amount)}</b>`:''}</div><div class="chips"><span class="pill ${x.status==='approved'?'green':x.status==='rejected'?'red':'gold'}">${esc(st(x.status))}</span><span class="chip">${esc(x.approval_type==='purchase'?'Закупка':x.approval_type==='work'?'Работы':'Решение')}</span></div>${x.status==='pending'?`<div class="approvalActions"><button class="btn gold approvalDecision" data-id="${x.id}" data-decision="approved">Согласовать</button><button class="btn red approvalDecision" data-id="${x.id}" data-decision="rejected">Отклонить</button></div>`:x.decision_comment?`<small>Комментарий: ${esc(x.decision_comment)}</small>`:''}</div>`).join(''):'<div class="empty">Нет запросов на согласование.</div>'}`}
function renderClient(){const titles={v1:['Мой объект','Текущий статус и важные события'],v2:['График работ','План и фактическое выполнение'],v3:['Смета и оплаты','Финансы по этапам'],v4:['Скрытые работы','Фотофиксация качества'],v5:['Согласования','Работы и закупки']},ctx=titles[S.view]||titles.v1;shellRole('client',ctx[0],ctx[1]);$('#modeTitle').textContent='Кабинет заказчика';$('#v1').innerHTML=clientObject();$('#v2').innerHTML=clientGantt();$('#v3').innerHTML=clientEstimate();$('#v4').innerHTML=clientPhotos();$('#v5').innerHTML=clientApprovals();setView();tabs([['🏗','Объект'],['▥','График'],['₽','Смета'],['◉','Фото'],['✓','Решения']]);$('#cpSel')?.addEventListener('change',e=>{S.clientProject=Number(e.target.value);renderClient()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;renderClient()});document.querySelectorAll('.approvalDecision').forEach(b=>b.onclick=async()=>{const label=b.dataset.decision==='approved'?'согласовать':'отклонить';if(!confirm(`Подтвердить решение: ${label}?`))return;b.disabled=true;try{await clientCall('approval.decide',{approval_id:b.dataset.id,decision:b.dataset.decision});notice('Решение сохранено','ok');S.data=await clientCall();renderClient()}catch(x){notice(x.message,'error');b.disabled=false}})}
function renderLogin(message=''){S.mode='login';shellRole('login','','');$('#startup').hidden=true;$('#shell').hidden=false;$('#modeTitle').textContent='TIMCHENKO PLATFORM';$('#tabs').hidden=true;$('#v1').classList.add('on');$('#v2').classList.remove('on');$('#v3').classList.remove('on');$('#v1').innerHTML=`<div class="hero"><div class="eyebrow">Единая платформа объекта</div><h1>Личный кабинет</h1><p>Владелец управляет воронкой и всеми объектами. Заказчик видит только свой объект и опубликованные материалы.</p><div class="chips"><span class="chip">Системы</span><span class="chip">Работы</span><span class="chip">Материалы</span><span class="chip">Закупки</span></div></div><div class="card"><strong>${message?'Нужно войти снова':'Безопасный вход через Telegram'}</strong><p class="loginHint">${esc(message||'Откройте кабинет через @uzelpro_bot. Telegram подтвердит вашу личность и платформа автоматически покажет нужную роль.')}</p><div class="loginActions"><a class="btn gold" href="https://t.me/uzelpro_bot?start=cabinet" target="_blank" rel="noopener">Открыть Telegram-бот</a><button class="btn light" id="retryBoot" type="button">Проверить вход ещё раз</button>${token?'<button class="btn light" id="forgetAccess" type="button">Сбросить сохранённый вход</button>':''}</div></div>`;$('#retryBoot').onclick=()=>location.reload();$('#forgetAccess')?.addEventListener('click',()=>{try{localStorage.removeItem('timchenko_portal_token')}catch(e){}location.href=location.pathname})}
function renderAccessGate(code){S.mode='gate';shellRole('gate','','');$('#startup').hidden=true;$('#shell').hidden=false;$('#modeTitle').textContent='Доступ к кабинету';$('#tabs').hidden=true;const rejected=code==='access_rejected'||code==='access_revoked';$('#v1').innerHTML=`<div class="hero gateHero"><div class="gateIcon">${rejected?'⛔':'🔐'}</div><div class="eyebrow">TIMCHENKO GROUP · закрытый доступ</div><h1>${rejected?'Доступ не предоставлен':'Запрос отправлен'}</h1><p>${rejected?'Владелец пока не подтвердил доступ к кабинету. Свяжитесь с TIMCHENKO GROUP, если считаете это ошибкой.':'Ваш запрос уже видит владелец. После личного подтверждения доступ откроется автоматически.'}</p></div><div class="card"><strong>${rejected?'Что делать':'Что дальше'}</strong><p style="font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:0">${rejected?'Свяжитесь с владельцем и дождитесь решения.':'Владелец свяжется с вами, проверит данные и подтвердит вход. После уведомления нажмите «Обновить» или откройте кабинет из бота ещё раз.'}</p></div>`}
async function boot(){try{$('#startup').hidden=false;if(localDemo==='client'||localDemo==='admin'){S.mode=localDemo;S.data=localDemo==='admin'?demoAdmin:demoClient;showShell();localDemo==='admin'?renderAdmin():renderClient();return}if(!token&&!tg?.initData){renderLogin();return}if(token||tg?.initData){try{const d=await adminCall('bootstrap',{},8000);if(d?.mode==='admin'){S.mode='admin';S.data=d;showShell();renderAdmin();return}}catch(e){if(e.message!=='ADMIN_ONLY'&&e.message!=='TELEGRAM_AUTH_REQUIRED'&&!e.message.includes('403'))console.warn('Admin probe',e)}}S.mode='client';S.data=await clientCall();showShell();renderClient()}catch(e){if(['access_pending','access_rejected','access_revoked'].includes(e.code||e.message)){renderAccessGate(e.code||e.message);return}if(['expired_or_invalid_token','PORTAL_TOKEN_INVALID','PORTAL_TOKEN_REQUIRED'].includes(e.code||e.message)){try{localStorage.removeItem('timchenko_portal_token')}catch(x){}renderLogin('Сохранённая ссылка больше не действует. Получите новую ссылку в Telegram-боте.');return}renderLogin('Не удалось проверить доступ. Проверьте интернет и повторите попытку.')}}
$('#refreshBtn').onclick=async()=>{notice('Обновляю…');try{if(S.mode==='admin')await reloadAdmin();else if(S.mode==='gate')await boot();else{S.data=await clientCall();renderClient()}notice('Обновлено','ok')}catch(e){if(['access_pending','access_rejected','access_revoked'].includes(e.code||e.message))renderAccessGate(e.code||e.message);else notice(e.message,'error')}};$('#homeBtn').onclick=()=>{S.view='v1';S.lead=null;S.project=null;render()};
function render(){if(S.mode==='admin')renderAdmin();else if(S.mode==='client')renderClient()}
boot();
})();
</script>
</body></html>
