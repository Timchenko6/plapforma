name: Upgrade Timchenko client v3

on:
  push:
    paths:
      - '.github/workflows/upgrade-client-v3.yml'

permissions:
  contents: write

jobs:
  build-client-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add full stage planning editor and publish v3 path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('client-v2/index.html')
          s=p.read_text(encoding='utf-8')
          replacement=r'''function stageEditor(stages,sid){const x=stages.find(z=>z.id===sid);if(!x)return`<div class="notice">Выберите конкретный этап выше, чтобы планировать сроки, бюджет и прогресс.</div>`;return`<div class="card form"><div class="sectionHead" style="margin:0"><h2>План этапа</h2><span>${esc(x.name)}</span></div><div class="form2"><div><div class="label">Название</div><input class="input" id="seName" value="${esc(x.name||'')}"></div><div><div class="label">Система</div><input class="input" id="seSystem" value="${esc(x.system||'')}" placeholder="Отопление / ВК / Электрика"></div></div><textarea class="input" id="seDesc" placeholder="Что входит в этап">${esc(x.description||'')}</textarea><div class="form3"><div><div class="label">Статус</div><select class="input" id="seStatus"><option value="planned" ${x.status==='planned'?'selected':''}>Запланирован</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>В работе</option><option value="review" ${x.status==='review'?'selected':''}>Проверка</option><option value="done" ${x.status==='done'?'selected':''}>Готово</option><option value="blocked" ${x.status==='blocked'?'selected':''}>Стоп</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Отменён</option></select></div><div><div class="label">Готовность, %</div><input class="input" id="seProgress" inputmode="numeric" value="${Number(x.progress_percent||0)}"></div><div><div class="label">Бюджет этапа, ₽</div><input class="input" id="seBudget" inputmode="decimal" value="${esc(x.budget_amount||'')}"></div></div><div class="form2"><div><div class="label">План старт</div><input class="input" id="seStart" type="date" value="${String(x.planned_start||'').slice(0,10)}"></div><div><div class="label">План финиш</div><input class="input" id="seFinish" type="date" value="${String(x.planned_finish||'').slice(0,10)}"></div></div><div><div class="label">Видимость этапа</div><select class="input" id="seVis"><option value="client" ${x.visibility!=='team'?'selected':''}>Клиент видит</option><option value="team" ${x.visibility==='team'?'selected':''}>Только команда</option></select></div><button class="btn navy w100" id="saveStagePlan">Сохранить план этапа</button></div>`}
function objectAssets(d){const stages=d.stages||[],sid=S.stageId,docs=(d.documents||[]).filter(x=>(x.stage_id||'')===sid),media=(d.media||[]).filter(x=>(x.stage_id||'')===sid),pay=(d.payments||[]).filter(x=>(x.stage_id||'')===sid),est=(d.estimates||[]).filter(x=>(x.stage_id||'')===sid);return`<div class="section"><div class="sectionHead"><h2>Управление выбранным этапом</h2><span>${sid?esc(stages.find(x=>x.id===sid)?.name||'этап'):'Весь объект'}</span></div>${stageEditor(stages,sid)}<div class="assetNav"><button class="${S.asset==='photos'?'on':''}" data-asset="photos">📷 Фото ${media.length}</button><button class="${S.asset==='docs'?'on':''}" data-asset="docs">📄 Документы ${docs.length}</button><button class="${S.asset==='pay'?'on':''}" data-asset="pay">₽ Оплаты ${pay.length}</button><button class="${S.asset==='est'?'on':''}" data-asset="est">∑ Сметы ${est.length}</button></div>${S.asset==='photos'?photoAdmin(media):S.asset==='docs'?docsAdmin(docs):S.asset==='pay'?payAdmin(pay):estimateAdmin(est)}</div>`}
function visSwitch'''
          s,n=re.subn(r'function objectAssets\(d\)\{.*?\}\nfunction visSwitch',replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('objectAssets patch target not found')
          needle=" document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.asset=b.dataset.asset;renderAdmin()});"
          add=""" $('#saveStagePlan')?.addEventListener('click',async e=>{const sid=S.stageId;if(!sid)return;e.target.disabled=true;try{await adminCall('stage.update',{stage_id:sid,name:$('#seName').value,system:$('#seSystem').value||null,description:$('#seDesc').value||null,status:$('#seStatus').value,progress_percent:Math.max(0,Math.min(100,Number($('#seProgress').value)||0)),budget_amount:$('#seBudget').value||null,planned_start:$('#seStart').value||null,planned_finish:$('#seFinish').value||null,visibility:$('#seVis').value});notice('План этапа сохранён','ok');const pid=S.project.project.id;await openProject(pid);S.stageId=sid;renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});\n"""+needle
          if needle not in s: raise SystemExit('bind patch target not found')
          s=s.replace(needle,add,1)
          p.write_text(s,encoding='utf-8')
          d=Path('client-v3');d.mkdir(exist_ok=True)
          (d/'index.html').write_text(s,encoding='utf-8')
          PY
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('client-v3/index.html').read_text()
          b=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)[-1]
          print(b)
          PY
          )
      - name: Commit client v3
        shell: bash
        run: |
          git config user.name 'timchenko-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add client-v2/index.html client-v3/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add full stage planning and publish client v3'
          git push
