<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1530">
<title>Timchenko.pro · Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#eef2f6;--card:#fff;--text:#12213b;--muted:#6b7789;--line:#dce3ec;--navy:#0b1530;--navy2:#1b3156;--gold:#b88a00;--gold2:#d2aa29;--green:#237a51;--red:#a43c3c;--orange:#a86e08;--soft:#f4f6f9;--r:18px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#081226;--card:#101b32;--text:#eef3fa;--muted:#99a9c0;--line:#293a58;--soft:#15223a;--navy:#e9eef7;--navy2:#20365d}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea,a{font:inherit}button{cursor:pointer}.app{max-width:820px;margin:auto;padding:12px}.startup{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:11px;margin:2px 0 10px}.startup i{width:8px;height:8px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:3px 1px 12px}.brand{font-size:20px;font-weight:900;letter-spacing:-.04em}.brand b{color:var(--gold)}.sub{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}.topActions{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;min-height:37px;padding:0 11px;font-size:10px;font-weight:800}
.hero{background:linear-gradient(145deg,#0b1530,#20375e);color:#fff;border-radius:23px;padding:18px;margin-bottom:10px}.eyebrow{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#dfc35e;font-weight:850}.hero h1{font-size:25px;line-height:1.07;letter-spacing:-.04em;margin:6px 0}.hero p{margin:0;color:#c2cedd;font-size:11px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.chip{font-size:9px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.metric,.row,.stageCard{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}.card{padding:13px}.metric{padding:12px}.metric small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.06em}.metric b{display:block;font-size:17px;margin-top:5px}.section{margin-top:17px}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:9px;margin:0 2px 7px}.sectionHead h2{font-size:16px;margin:0}.sectionHead span{font-size:9px;color:var(--muted)}
.btn{border:0;border-radius:12px;min-height:39px;padding:0 12px;font-weight:850;font-size:10px}.btn.navy{background:#0b1530;color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.light{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.red{background:#fff0f0;color:var(--red);border:1px solid #e9c0c0}.btn.w100{width:100%}.btn:disabled{opacity:.5}.input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 11px;outline:none;font-size:15px}.input:focus{border-color:var(--gold)}textarea.input{min-height:80px;resize:vertical}.label{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin:0 0 4px 2px}.form{display:grid;gap:8px}.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{padding:11px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}.row:last-child{margin-bottom:0}.row strong{display:block;font-size:11px}.row small{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.35}.pill{font-size:8px;padding:5px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}.pill.green{color:var(--green)}.pill.red{color:var(--red)}.pill.gold{color:var(--gold)}.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:10px}.notice{border:1px solid #dfc979;background:#fff8e4;color:#725500;border-radius:13px;padding:10px;font-size:10px;line-height:1.45;margin-bottom:8px}.notice.error{border-color:#e6b3b3;background:#fff0f0;color:#812d2d}.notice.ok{border-color:#a9d5bd;background:#effbf4;color:#216844}
.tabs{position:fixed;z-index:30;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(804px,calc(100% - 14px));display:grid;gap:3px;padding:6px;background:rgba(11,21,48,.97);border-radius:18px}.tab{border:0;background:transparent;color:#9dacbf;border-radius:11px;padding:7px 2px;font-size:8px}.tab b{font-size:15px;display:block;margin-bottom:2px}.tab.on{color:#fff;background:rgba(255,255,255,.11)}.view{display:none}.view.on{display:block}
.pipeline{display:flex;gap:6px;overflow:auto;padding:1px 1px 7px;scrollbar-width:none}.pipeline::-webkit-scrollbar{display:none}.pipe{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 10px;white-space:nowrap;font-size:9px;font-weight:800}.pipe.on{background:#0b1530;color:#fff;border-color:#0b1530}.lead{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:12px;margin-bottom:7px}.leadTop{display:flex;justify-content:space-between;gap:8px}.lead h3{font-size:13px;margin:0}.lead p{font-size:9px;color:var(--muted);margin:4px 0 0}.leadMeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.leadMeta span{font-size:8px;background:var(--soft);padding:5px 6px;border-radius:8px}.leadValue{font-weight:900;font-size:11px;white-space:nowrap}.back{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800;padding:3px 0 9px}.json{white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:10px;font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:240px;overflow:auto}.link{color:inherit;text-decoration:none}.link:hover{color:var(--gold)}
.projectBtn{width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:7px}.projectBtn h3{font-size:13px;margin:0}.projectBtn p{font-size:9px;color:var(--muted);margin:4px 0}.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}.projectFoot{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:8px;color:var(--muted)}
.stageCard{padding:12px;margin-bottom:7px}.stageTop{display:flex;justify-content:space-between;gap:8px}.stageCard h3{font-size:12px;margin:0}.stageCard p{font-size:9px;color:var(--muted);margin:4px 0}.stageActions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.stageActions button{min-height:32px}.stageCard.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(184,138,0,.15)}
.assetNav{display:flex;gap:5px;overflow:auto;margin:8px 0}.assetNav button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:7px 8px;font-size:8px;font-weight:800;white-space:nowrap}.assetNav button.on{background:var(--soft);color:var(--text)}.fileInput{padding:8px;font-size:11px}.switch{display:flex;gap:6px;align-items:center;font-size:9px;color:var(--muted)}.switch input{width:17px;height:17px}.thumbGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.thumb{aspect-ratio:1.15;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end}.thumb b{font-size:9px}.thumb small{font-size:8px;color:var(--muted);margin-top:3px}.photo{position:relative;aspect-ratio:1.2;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft)}.photo img{width:100%;height:100%;object-fit:cover}.photoCap{position:absolute;inset:auto 0 0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:8px}
.clientStage{margin-bottom:8px}.clientStage summary{list-style:none;cursor:pointer}.clientStage summary::-webkit-details-marker{display:none}.stageSummary{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}.stageSummaryTop{display:flex;justify-content:space-between;gap:8px}.stageSummary b{font-size:11px}.stageSummary small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.stageBody{padding:8px 2px 2px}.stageBody h4{font-size:11px;margin:12px 2px 6px}.profile{padding:15px}.profile h2{font-size:20px;margin:4px 0}.profile p{font-size:11px;color:var(--muted);margin:4px 0}.verified{color:var(--green);font-weight:850}
@media(max-width:520px){.form2,.form3{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.thumbGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:23px}}@media(min-width:650px){.clientPhotos{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<div id="startup" class="startup"><i></i><span>Загрузка данных…</span></div>
<div id="notice"></div>
<div id="shell" hidden>
 <div class="top"><div><div class="brand">Timchenko<b>.pro</b></div><div class="sub" id="modeTitle">Кабинет</div></div><div class="topActions"><button class="iconbtn" id="homeBtn">⌂</button><button class="iconbtn" id="refreshBtn">↻</button></div></div>
 <section class="view on" id="v1"></section><section class="view" id="v2"></section><section class="view" id="v3"></section>
</div>
</main>
<nav class="tabs" id="tabs" hidden></nav>
<script>
(()=>{
const ADMIN_API='https://zzeeqwrndhpqdxyzpsqo.supabase.co/functions/v1/admin-crm-api';
const CLIENT_API='https://zzeeqwrndhpqdxyzpsqo.supabase.co/functions/v1/client-portal';
const tg=window.Telegram?.WebApp||null;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0b1530')}catch(e){}
const token=new URLSearchParams(location.search).get('token')||'';
const S={mode:'',data:null,view:'v1',leadStage:'new',lead:null,project:null,stageId:'',asset:'photos',clientProject:0};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽',dt=v=>v?new Date(v).toLocaleDateString('ru-RU'):'—';
const qname=s=>({water_node:'Узел ввода воды',engineering_nodes:'Узел ввода воды',engineering:'Инженерные системы',home_engineering:'Инженерные системы',electric:'Электрика',electrical:'Электрика'}[s]||s||'Заявка');
const stageNames={new:'Новые',contacted:'Связались',qualified:'Квалифицирован',estimate:'Смета',proposal:'КП отправлено',negotiation:'Переговоры',won:'Выигран',lost:'Проигран'};
const pStatus={lead:'Заявка',survey:'Исходные данные',design:'Проектирование',estimate:'Смета',approved:'Согласовано',procurement:'Комплектация',installation:'Монтаж',commissioning:'Пусконаладка',completed:'Завершён',paused:'Пауза',cancelled:'Отменён'};
const st=s=>pStatus[s]||({planned:'Запланирован',in_progress:'В работе',review:'Проверка',done:'Готово',blocked:'Стоп',draft:'Черновик',issued:'Опубликован',paid:'Оплачено',requested:'Запрошено'}[s]||s||'—');
function notice(t,type=''){ $('#notice').innerHTML=t?`<div class="notice ${type}">${esc(t)}</div>`:'' }
async function adminCall(action,p={}){const r=await fetch(ADMIN_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData:tg?.initData||'',...p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function clientCall(){const r=await fetch(CLIENT_API+'?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function upload(action,file,p={}){const f=new FormData();f.append('action',action);f.append('initData',tg?.initData||'');f.append('file',file);Object.entries(p).forEach(([k,v])=>f.append(k,String(v??'')));const r=await fetch(ADMIN_API,{method:'POST',body:f});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function showShell(){ $('#startup').hidden=true;$('#shell').hidden=false;$('#tabs').hidden=false }
function tabs(items){$('#tabs').style.gridTemplateColumns=`repeat(${items.length},1fr)`;$('#tabs').innerHTML=items.map((x,i)=>`<button class="tab ${S.view==='v'+(i+1)?'on':''}" data-view="v${i+1}"><b>${x[0]}</b>${x[1]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()})}
function setView(){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===S.view))}
function fmtAnswers(a){if(!a||typeof a!=='object')return'Нет данных';return Object.entries(a).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v):v}`).join('\n')||'Нет данных'}
function pipeline(){const a=S.data.pipeline||Object.keys(stageNames);return`<div class="pipeline">${a.map(k=>`<button class="pipe ${S.leadStage===k?'on':''}" data-pipe="${k}">${stageNames[k]} · ${(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===k).length}</button>`).join('')}</div>`}
function leadList(){const a=(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===S.leadStage);return`${pipeline()}${a.length?a.map(x=>`<button class="lead" data-lead="${x.id}"><div class="leadTop"><div><h3>${esc(x.name||x.phone||'Без имени')}</h3><p>${esc(qname(x.quiz_type))} · ${esc(x.city||'город не указан')} · ${dt(x.created_at)}</p></div><div class="leadValue">${x.estimated_value?money(x.estimated_value):''}</div></div><div class="leadMeta"><span>${esc(x.source||'')}</span><span>${esc(x.phone||'без телефона')}</span>${x.next_action_at?`<span>След.: ${dt(x.next_action_at)}</span>`:''}${x.project_id?'<span>Есть объект</span>':''}</div></button>`).join(''):'<div class="empty">В этой колонке лидов нет.</div>'}`}
function leadDetail(){const x=S.lead;if(!x)return leadList();const answers=x.payload?.answers||{};return`<button class="back" data-lead-back>← Воронка</button><div class="hero"><div class="eyebrow">Лид #${x.id} · ${esc(stageNames[x.pipeline_stage]||x.pipeline_stage)}</div><h1>${esc(x.name||'Клиент')}</h1><p>${esc(qname(x.quiz_type))} · ${esc(x.source||'')}</p><div class="chips"><a class="chip" href="tel:${esc(x.phone||'')}">${esc(x.phone||'Без телефона')}</a>${x.city?`<span class="chip">${esc(x.city)}</span>`:''}</div></div><div class="sectionHead"><h2>Исходные данные квиза</h2><span>${dt(x.created_at)}</span></div><div class="json">${esc(fmtAnswers(answers))}</div>${x.comment?`<div class="section"><div class="label">Комментарий клиента</div><div class="card">${esc(x.comment)}</div></div>`:''}<div class="section"><div class="sectionHead"><h2>Продажа</h2></div><div class="card form"><div><div class="label">Этап воронки</div><select class="input" id="leadStage">${Object.entries(stageNames).map(([k,v])=>`<option value="${k}" ${x.pipeline_stage===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form2"><div><div class="label">Потенциал сделки</div><input class="input" id="leadValue" inputmode="decimal" value="${esc(x.estimated_value||'')}" placeholder="₽"></div><div><div class="label">Следующее действие</div><input class="input" id="leadNext" type="datetime-local" value="${x.next_action_at?new Date(x.next_action_at).toISOString().slice(0,16):''}"></div></div><div><div class="label">Мои заметки</div><textarea class="input" id="leadNotes" placeholder="Что обсуждали, что отправить, когда перезвонить">${esc(x.admin_notes||'')}</textarea></div><button class="btn navy w100" id="saveLead">Сохранить лид</button>${x.project_id?`<button class="btn gold w100" data-open-project="${x.project_id}">Открыть объект</button>`:`<button class="btn gold w100" id="convertLead">Создать объект из этого лида</button>`}</div></div>`}
function adminLeads(){return`<div class="hero"><div class="eyebrow">CRM · только для владельца</div><h1>Воронка продаж</h1><p>Все заявки сайта и Telegram-квизов в одном месте. После сделки лид превращается в объект без повторного ввода данных.</p></div>${S.lead?leadDetail():leadList()}`}
function projectList(){const a=S.data.projects||[];return`<div class="hero"><div class="eyebrow">Управление объектами</div><h1>Проекты и стройка</h1><p>Исходные данные, этапы, сметы, оплаты, документы и фотоотчёты.</p><div class="chips"><span class="chip">${a.length} объектов</span></div></div>${a.length?a.map(p=>`<button class="projectBtn" data-open-project="${p.id}"><div class="leadTop"><div><h3>${esc(p.title)}</h3><p>${esc(p.client?[p.client.first_name,p.client.last_name].filter(Boolean).join(' '):'Клиент не привязан')} · ${esc(p.city||p.address||'')}</p></div><span class="pill">${esc(st(p.status))}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div><div class="projectFoot"><span>${p.progress_percent||0}% · ${esc(p.current_stage||'')}</span><span>${p.document_count||0} док. · ${p.media_count||0} фото</span></div></button>`).join(''):'<div class="empty">Объектов пока нет. Конвертируйте первый лид.</div>'}`}
function objectAssets(d){const stages=d.stages||[],sid=S.stageId,docs=(d.documents||[]).filter(x=>(x.stage_id||'')===sid),media=(d.media||[]).filter(x=>(x.stage_id||'')===sid),pay=(d.payments||[]).filter(x=>(x.stage_id||'')===sid),est=(d.estimates||[]).filter(x=>(x.stage_id||'')===sid);return`<div class="section"><div class="sectionHead"><h2>Управление выбранным этапом</h2><span>${sid?esc(stages.find(x=>x.id===sid)?.name||'этап'):'Весь объект'}</span></div><div class="assetNav"><button class="${S.asset==='photos'?'on':''}" data-asset="photos">📷 Фото ${media.length}</button><button class="${S.asset==='docs'?'on':''}" data-asset="docs">📄 Документы ${docs.length}</button><button class="${S.asset==='pay'?'on':''}" data-asset="pay">₽ Оплаты ${pay.length}</button><button class="${S.asset==='est'?'on':''}" data-asset="est">∑ Сметы ${est.length}</button></div>${S.asset==='photos'?photoAdmin(media):S.asset==='docs'?docsAdmin(docs):S.asset==='pay'?payAdmin(pay):estimateAdmin(est)}</div>`}
function visSwitch(){return`<label class="switch"><input type="checkbox" id="pubClient"> Показать клиенту сразу</label>`}
function photoAdmin(a){return`<div class="card form"><div><div class="label">Фото отчёта</div><input class="input fileInput" type="file" id="photoFile" accept="image/jpeg,image/png,image/webp"></div><input class="input" id="photoCaption" placeholder="Комментарий: опрессовка, скрытые работы…">${visSwitch()}<button class="btn navy w100" id="uploadPhoto">Загрузить фото</button></div><div class="sectionHead" style="margin-top:10px"><h2>Фото этого этапа</h2></div>${a.length?`<div class="thumbGrid">${a.map(x=>`<div class="thumb"><b>${esc(x.file_name||'Фото')}</b><small>${x.visibility==='client'?'Клиент видит':'Только команда'} · ${dt(x.created_at)}</small><button class="btn light vis" data-entity="media" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}" style="margin-top:6px">${x.visibility==='client'?'Скрыть':'Опубликовать'}</button></div>`).join('')}</div>`:'<div class="empty">Фото на этом этапе ещё нет.</div>'}`}
function docsAdmin(a){return`<div class="card form"><div><div class="label">Файл документа</div><input class="input fileInput" type="file" id="docFile" accept=".pdf,.xlsx,.xls,.docx,.doc,.csv"></div><div class="form2"><input class="input" id="docTitle" placeholder="Название документа"><select class="input" id="docType"><option value="project">Проект</option><option value="estimate">Смета</option><option value="proposal">КП</option><option value="contract">Договор</option><option value="act">Акт</option><option value="invoice">Счёт</option><option value="receipt">Чек</option><option value="specification">Спецификация</option><option value="other">Другое</option></select></div>${visSwitch()}<button class="btn navy w100" id="uploadDoc">Загрузить документ</button></div><div class="sectionHead" style="margin-top:10px"><h2>Документы этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><button class="btn light vis" data-entity="document" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div>`).join(''):'<div class="empty">Документов на этом этапе нет.</div>'}`}
function payAdmin(a){return`<div class="card form"><div class="form2"><div><div class="label">Сумма</div><input class="input" id="payAmount" inputmode="decimal" placeholder="₽"></div><div><div class="label">Срок оплаты</div><input class="input" id="payDue" type="date"></div></div><input class="input" id="payNote" placeholder="Например: аванс за этап монтажа"><select class="input" id="payStatus"><option value="planned">Запланировано</option><option value="requested">Запрошено</option><option value="paid">Оплачено</option></select><button class="btn navy w100" id="addPay">Добавить этап оплаты</button></div><div class="sectionHead" style="margin-top:10px"><h2>Оплаты этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||x.payment_type||'')} · ${dt(x.paid_at||x.due_date||x.created_at)}</small></div><div style="display:flex;gap:5px;align-items:center"><span class="pill">${esc(st(x.status))}</span>${x.status!=='paid'?`<button class="btn light markPaid" data-id="${x.id}">Оплачено</button>`:''}</div></div>`).join(''):'<div class="empty">Оплат на этом этапе нет.</div>'}`}
function estimateAdmin(a){return`<div class="card form"><input class="input" id="estTitle" value="Смета по этапу" placeholder="Название сметы">${visSwitch()}<button class="btn navy w100" id="addEst">Создать смету</button><div style="font-size:9px;color:var(--muted)">После создания смета появляется в общей базе. Наполнение материалами/работами продолжим через единый сметный движок.</div></div><div class="sectionHead" style="margin-top:10px"><h2>Сметы этого этапа</h2></div>${a.length?a.map(x=>{const t=Number(x.labor_total||0)+Number(x.mat_total||0)+Number(x.equipment_total||0)-Number(x.discount_total||0);return`<div class="row"><div><strong>${esc(x.title)}</strong><small>v${x.version||1} · ${esc(st(x.status))}</small></div><div style="text-align:right"><b>${money(t)}</b><button class="btn light vis" data-entity="estimate" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}" style="display:block;margin-top:4px">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div></div>`}).join(''):'<div class="empty">Смет на этом этапе нет.</div>'}`}
function projectDetail(){const d=S.project;if(!d)return projectList();const p=d.project,src=p.source_data||{},stages=d.stages||[];if(S.stageId&&!stages.some(x=>x.id===S.stageId))S.stageId='';return`<button class="back" data-project-back>← Все объекты</button><div class="hero"><div class="eyebrow">Объект · ${esc(st(p.status))}</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||'')} · ${Number(p.progress_percent||0)}%</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}${d.client?`<span class="chip">${esc([d.client.first_name,d.client.last_name].filter(Boolean).join(' '))}</span>`:''}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="card form"><div class="form2"><input class="input" id="pTitle" value="${esc(p.title)}" placeholder="Название"><select class="input" id="pStatus">${Object.entries(pStatus).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form3"><input class="input" id="pCity" value="${esc(p.city||'')}" placeholder="Город"><input class="input" id="pArea" inputmode="decimal" value="${esc(p.area_m2||'')}" placeholder="м²"><input class="input" id="pProgress" inputmode="numeric" value="${esc(p.progress_percent||0)}" placeholder="%"></div><input class="input" id="pAddress" value="${esc(p.address||'')}" placeholder="Адрес"><div class="form2"><input class="input" id="pStage" value="${esc(p.current_stage||'')}" placeholder="Текущий этап"><input class="input" id="pBudget" inputmode="decimal" value="${esc(p.budget_estimate||'')}" placeholder="Бюджет ₽"></div><button class="btn navy w100" id="saveProject">Сохранить объект</button></div>${src.lead_id?`<div class="section"><div class="sectionHead"><h2>Исходные данные клиента</h2><span>из лида #${src.lead_id}</span></div><div class="json">${esc(fmtAnswers(src.answers||src.payload?.answers||{}))}</div></div>`:''}<div class="section"><div class="sectionHead"><h2>Этапы работ</h2><button class="btn light" id="newStage">＋ Этап</button></div>${stages.length?stages.map(s=>`<div class="stageCard ${S.stageId===s.id?'active':''}"><div class="stageTop"><div><h3>${esc(s.name)}</h3><p>${esc(s.system||'')} · ${s.planned_finish?'до '+dt(s.planned_finish):'срок не задан'}</p></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div><div class="stageActions"><button class="btn ${S.stageId===s.id?'gold':'light'}" data-stage-select="${s.id}">${S.stageId===s.id?'Выбран':'Управлять'}</button><button class="btn light" data-stage-edit="${s.id}">Изменить</button><span class="pill">${esc(st(s.status))}</span>${s.budget_amount?`<span class="pill">${money(s.budget_amount)}</span>`:''}</div></div>`).join(''):'<div class="empty">Этапов пока нет.</div>'}</div>${objectAssets(d)}`}
function adminObjects(){return S.project?projectDetail():projectList()}
function adminProfile(){const a=S.data.admin||{};return`<div class="hero"><div class="eyebrow">Безопасность</div><h1>Админка Timchenko.pro</h1><p>Этот режим открывается только Telegram-аккаунту владельца из platform_admins.</p></div><div class="card profile"><h2>${esc(a.display_name||'Владелец')}</h2><p class="verified">✓ Полный доступ</p><p>Лиды → объекты → этапы → сметы → оплаты → документы → фотоотчёты.</p></div>`}
function renderAdmin(){ $('#modeTitle').textContent='CRM / Управление · только владелец';$('#v1').innerHTML=adminLeads();$('#v2').innerHTML=adminObjects();$('#v3').innerHTML=adminProfile();setView();tabs([['◎','Лиды'],['🏗','Объекты'],['👤','Админ']]);bindAdmin() }
async function reloadAdmin(keep=true){const d=await adminCall('bootstrap');S.data=d;if(!keep){S.lead=null;S.project=null;S.stageId=''}renderAdmin()}
async function openProject(id){notice('Загружаю объект…');S.project=await adminCall('project.detail',{project_id:id});S.stageId=S.project.stages?.[0]?.id||'';S.view='v2';notice('');renderAdmin()}
function bindAdmin(){document.querySelectorAll('[data-pipe]').forEach(b=>b.onclick=()=>{S.leadStage=b.dataset.pipe;S.lead=null;renderAdmin()});document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{S.lead=(S.data.leads||[]).find(x=>String(x.id)===String(b.dataset.lead));renderAdmin()});document.querySelector('[data-lead-back]')?.addEventListener('click',()=>{S.lead=null;renderAdmin()});document.querySelectorAll('[data-open-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.openProject));document.querySelector('[data-project-back]')?.addEventListener('click',()=>{S.project=null;S.stageId='';renderAdmin()});
 $('#saveLead')?.addEventListener('click',async e=>{e.target.disabled=true;try{const next=$('#leadNext').value;await adminCall('lead.update',{lead_id:S.lead.id,pipeline_stage:$('#leadStage').value,estimated_value:$('#leadValue').value,admin_notes:$('#leadNotes').value,next_action_at:next?new Date(next).toISOString():null});notice('Лид сохранён','ok');const id=S.lead.id;await reloadAdmin();S.lead=(S.data.leads||[]).find(x=>x.id===id);renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#convertLead')?.addEventListener('click',async e=>{if(!confirm('Создать объект и привязать к нему данные этого квиза?'))return;e.target.disabled=true;try{const d=await adminCall('lead.convert',{lead_id:S.lead.id});notice('Объект создан из лида','ok');await reloadAdmin();S.project=d;S.lead=null;S.view='v2';S.stageId=d.stages?.[0]?.id||'';renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#saveProject')?.addEventListener('click',async e=>{e.target.disabled=true;try{const pid=S.project.project.id;await adminCall('project.update',{project_id:pid,title:$('#pTitle').value,status:$('#pStatus').value,city:$('#pCity').value,address:$('#pAddress').value,area_m2:$('#pArea').value||null,progress_percent:$('#pProgress').value||0,current_stage:$('#pStage').value,budget_estimate:$('#pBudget').value||null});notice('Объект обновлён','ok');await openProject(pid);await reloadAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#newStage')?.addEventListener('click',async()=>{const name=prompt('Название этапа','Новый этап');if(!name)return;try{const d=await adminCall('stage.create',{project_id:S.project.project.id,name,sort_order:(S.project.stages?.length||0)*10+10,visibility:'client'});notice('Этап добавлен','ok');await openProject(S.project.project.id);S.stageId=d.stage.id;renderAdmin()}catch(x){notice(x.message,'error')}});
 document.querySelectorAll('[data-stage-select]').forEach(b=>b.onclick=()=>{S.stageId=b.dataset.stageSelect;renderAdmin()});document.querySelectorAll('[data-stage-edit]').forEach(b=>b.onclick=async()=>{const s=S.project.stages.find(x=>x.id===b.dataset.stageEdit);if(!s)return;const name=prompt('Название этапа',s.name);if(name===null)return;const progress=prompt('Готовность, %',String(s.progress_percent||0));if(progress===null)return;const status=prompt('Статус: planned / in_progress / review / done / blocked',s.status||'planned');if(status===null)return;try{await adminCall('stage.update',{stage_id:s.id,name,progress_percent:Number(progress)||0,status});notice('Этап обновлён','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}});
 document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.asset=b.dataset.asset;renderAdmin()});
 $('#uploadPhoto')?.addEventListener('click',async e=>{const f=$('#photoFile').files?.[0];if(!f)return notice('Выберите фото','error');e.target.disabled=true;try{await upload('upload_media',f,{project_id:S.project.project.id,stage_id:S.stageId,caption:$('#photoCaption').value,visibility:$('#pubClient').checked?'client':'team'});notice('Фото загружено','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#uploadDoc')?.addEventListener('click',async e=>{const f=$('#docFile').files?.[0];if(!f)return notice('Выберите документ','error');e.target.disabled=true;try{await upload('upload_document',f,{project_id:S.project.project.id,stage_id:S.stageId,title:$('#docTitle').value||f.name,document_type:$('#docType').value,visibility:$('#pubClient').checked?'client':'team'});notice('Документ загружен','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#addPay')?.addEventListener('click',async e=>{if(!Number($('#payAmount').value))return notice('Введите сумму','error');e.target.disabled=true;try{await adminCall('payment.create',{project_id:S.project.project.id,stage_id:S.stageId||null,amount:$('#payAmount').value,due_date:$('#payDue').value||null,note:$('#payNote').value,status:$('#payStatus').value});notice('Этап оплаты добавлен','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 document.querySelectorAll('.markPaid').forEach(b=>b.onclick=async()=>{try{await adminCall('payment.update',{payment_id:b.dataset.id,status:'paid'});notice('Оплата отмечена','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}});
 $('#addEst')?.addEventListener('click',async e=>{e.target.disabled=true;try{await adminCall('estimate.create',{project_id:S.project.project.id,stage_id:S.stageId||null,title:$('#estTitle').value||'Смета',visibility:$('#pubClient').checked?'client':'team'});notice('Смета создана','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 document.querySelectorAll('.vis').forEach(b=>b.onclick=async()=>{try{await adminCall('visibility.update',{entity:b.dataset.entity,id:b.dataset.id,visibility:b.dataset.vis});notice(b.dataset.vis==='client'?'Опубликовано клиенту':'Скрыто от клиента','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}})
}
function cp(){return S.data?.projects?.[S.clientProject]||null}function clientSelect(){const a=S.data?.projects||[];if(a.length<2)return'';return`<select class="input" id="cpSel" style="margin-top:10px">${a.map((x,i)=>`<option value="${i}" ${i===S.clientProject?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}
function clientStages(p){const stages=p?.stages||[];if(!stages.length)return'<div class="empty">Этапы появятся после планирования.</div>';return stages.map(s=>{const docs=(p.documents||[]).filter(x=>x.stage_id===s.id),media=(p.media||[]).filter(x=>x.stage_id===s.id),pay=(p.payments||[]).filter(x=>x.stage_id===s.id),est=(p.estimates||[]).filter(x=>x.stage_id===s.id);return`<details class="clientStage" ${s.status==='in_progress'?'open':''}><summary><div class="stageSummary"><div class="stageSummaryTop"><div><b>${esc(s.name)}</b><small>${esc(s.description||s.system||'')}${s.planned_finish?' · до '+dt(s.planned_finish):''}</small></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div></div></summary><div class="stageBody">${est.length?`<h4>Сметы</h4>${est.map(e=>{const t=Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0);return`<div class="row"><div><strong>${esc(e.title)}</strong><small>v${e.version||1}</small></div><b>${money(t)}</b></div>`}).join('')}`:''}${pay.length?`<h4>Оплаты</h4>${pay.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||'')} · ${dt(x.paid_at||x.due_date)}</small></div><span class="pill">${esc(st(x.status))}</span></div>`).join('')}`:''}${docs.length?`<h4>Документы</h4>${docs.map(x=>`<a class="row link" ${x.url?`href="${esc(x.url)}" target="_blank"`:''}><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><span class="pill">${x.url?'Открыть':esc(st(x.status))}</span></a>`).join('')}`:''}${media.length?`<h4>Фотоотчёт</h4><div class="thumbGrid clientPhotos">${media.filter(x=>x.url).map(x=>`<a class="photo" href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" loading="lazy">${x.caption?`<div class="photoCap">${esc(x.caption)}</div>`:''}</a>`).join('')}</div>`:''}${!est.length&&!pay.length&&!docs.length&&!media.length?'<div class="empty">Материалы по этапу ещё не опубликованы.</div>':''}</div></details>`}).join('')}
function clientObject(){const p=cp();if(!p)return`<div class="hero"><div class="eyebrow">Личный кабинет</div><h1>Объект пока не создан</h1><p>Ваши расчёты уже сохранены. После создания объекта он появится здесь автоматически.</p></div>`;return`<div class="hero"><div class="eyebrow">Мой объект</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||st(p.status))}</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}<span class="chip">${esc(st(p.status))}</span></div>${clientSelect()}<div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="grid g3"><div class="metric"><small>Готовность</small><b>${p.progress_percent||0}%</b></div><div class="metric"><small>Бюджет</small><b>${p.budget_estimate?money(p.budget_estimate):'—'}</b></div><div class="metric"><small>Оплачено</small><b>${p.paid_amount?money(p.paid_amount):'—'}</b></div></div><div class="section"><div class="sectionHead"><h2>Этапы работ</h2><span>Фото и документы по этапам</span></div>${clientStages(p)}</div>`}
function clientQuizzes(){const a=S.data?.quizzes||[];return`<div class="hero"><div class="eyebrow">Расчёты КП</div><h1>Ваши исходные данные</h1><p>Ответы квизов сохраняются и переходят в карточку объекта после начала работы.</p></div>${a.length?a.map(x=>`<div class="row"><div><strong>${esc(qname(x.quiz_type))}</strong><small>${dt(x.created_at)}</small></div><span class="pill">${x.project_id?'В объекте':'Сохранён'}</span></div>`).join(''):'<div class="empty">Расчётов пока нет.</div>'}`}
function clientProfile(){const u=S.data?.profile||{};return`<div class="hero"><div class="eyebrow">Заказчик</div><h1>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Профиль')}</h1><p>Здесь видны только ваши объекты и опубликованные для вас материалы.</p></div><div class="card profile"><p>${esc(u.phone||'')}</p><p>${esc(u.email||'')}</p><p class="verified">${S.data?.identity?.phone_verified?'✓ Номер подтверждён':'Профиль связан с объектом'}</p></div>`}
function renderClient(){ $('#modeTitle').textContent='Личный кабинет заказчика';$('#v1').innerHTML=clientObject();$('#v2').innerHTML=clientQuizzes();$('#v3').innerHTML=clientProfile();setView();tabs([['🏗','Объект'],['∑','Расчёты'],['👤','Профиль']]);$('#cpSel')?.addEventListener('change',e=>{S.clientProject=Number(e.target.value);renderClient()}) }
async function boot(){try{if(tg?.initData){try{const d=await adminCall('bootstrap');if(d?.mode==='admin'){S.mode='admin';S.data=d;showShell();renderAdmin();return}}catch(e){if(e.message!=='ADMIN_ONLY'&&e.message!=='TELEGRAM_AUTH_REQUIRED'&&!e.message.includes('403'))console.warn('Admin probe',e)}}if(!token)throw Error('Откройте личный кабинет из кнопки «Мой объект» в боте Timchenko.pro.');S.mode='client';S.data=await clientCall();showShell();renderClient()}catch(e){$('#startup').hidden=true;$('#shell').hidden=false;$('#modeTitle').textContent='Кабинет';$('#v1').innerHTML=`<div class="hero"><div class="eyebrow">Timchenko.pro</div><h1>Кабинет не загрузился</h1><p>${esc(e.message)}</p></div><div class="empty">Вернитесь в @uzelpro_bot и откройте «Мой объект» ещё раз.</div>`;$('#tabs').hidden=true}}
$('#refreshBtn').onclick=async()=>{notice('Обновляю…');try{if(S.mode==='admin')await reloadAdmin();else{S.data=await clientCall();renderClient()}notice('Обновлено','ok')}catch(e){notice(e.message,'error')}};$('#homeBtn').onclick=()=>{S.view='v1';S.lead=null;S.project=null;render()};
function render(){if(S.mode==='admin')renderAdmin();else if(S.mode==='client')renderClient()}
boot();
})();
</script>
</body></html>
