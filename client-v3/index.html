 <div class="top"><div><div class="brand">Timchenko<b>.pro</b></div><div class="sub" id="modeTitle">Рабочая панель</div></div><div class="topActions"><button class="iconbtn" id="homeBtn">⌂</button><button class="iconbtn" id="refreshBtn">↻</button></div></div>

<script>
(()=>{
const ADMIN_API='https://zzeeqwrndhpqdxyzpsqo.supabase.co/functions/v1/admin-crm-api';
const CLIENT_API='https://zzeeqwrndhpqdxyzpsqo.supabase.co/functions/v1/client-portal';
const tg=window.Telegram?.WebApp||null;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0b1530')}catch(e){}
const token=new URLSearchParams(location.search).get('token')||'';
const S={mode:'',data:null,view:'v1',leadStage:'new',lead:null,project:null,stageId:'',asset:'photos',clientProject:0};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽',dt=v=>v?new Date(v).toLocaleDateString('ru-RU'):'—';
const qname=s=>({water_node:'Узел ввода воды',engineering_nodes:'Узел ввода воды',engineering:'Инженерные системы дома',home_engineering:'Инженерные системы дома',electric:'Электрика',electrical:'Электрика',other:'Обращение клиента'}[s]||'Заявка');
const sourceNames={website:'Форма на сайте',website_chat:'Чат на сайте',telegram_quiz:'Квиз в Telegram',telegram_bot:'Telegram-бот',telegram_mini_app:'Telegram Mini App'};
const answerLabels={housing:'Тип объекта',meters:'Где находятся счётчики',risers:'Количество стояков',outlets:'Точки водоснабжения',placement:'Размещение узла',nodePlacement:'Размещение узла',filtration:'Фильтрация воды',heater:'Водонагреватель',leak:'Защита от протечек',leakProtection:'Защита от протечек',heating_layout:'Разводка отопления',heatingLayout:'Разводка отопления',design:'Наличие проекта',extras:'Дополнительное оборудование',area:'Площадь дома',area_m2:'Площадь дома',floors:'Количество этажей',bathrooms:'Количество санузлов',systems:'Нужные инженерные системы',scope:'Объём работ',timing:'Когда планируется начало',project:'Проектная документация',material:'Материал дома',channel:'Удобный способ связи',total:'Предварительная стоимость',range:'Расчётный диапазон',city:'Город',files:'Приложенные файлы'};
const answerValues={
 'housing:new':'Новостройка','housing:secondary':'Вторичное жильё','housing:house':'Частный дом',
 'meters:apartment':'В квартире','meters:corridor':'В общем коридоре','meters:basement':'В подвале или техпомещении',
 'placement:installation':'Над инсталляцией унитаза','placement:closet':'В техническом шкафу','placement:boiler':'В котельной',
 'filtration:cartridge_5':'Картриджный фильтр 5 мкм','filtration:self_wash_100':'Самопромывной фильтр 100 мкм','filtration:none':'Без дополнительной фильтрации',
 'heater:flow_1_phase':'Проточный водонагреватель, 1 фаза','heater:flow_3_phase':'Проточный водонагреватель, 3 фазы','heater:storage':'Накопительный водонагреватель','heater:none':'Не требуется',
 'leak:app':'Защита «Нептун» с управлением через приложение','leak:relay':'Защита от протечек с реле','leak:none':'Не требуется',
 'heating_layout:radial':'Лучевая разводка по полу','heating_layout:tee':'Тройниковая разводка',
 'design:yes':'Проект есть','design:no':'Проекта нет','extras:steam_machine':'Парогенератор','extras:vacuum_station':'Вакуумная станция','extras:washer_hot':'Стиральная машина с горячей водой'
};
const stageNames={new:'Новые',contacted:'Связались',qualified:'Квалифицирован',estimate:'Смета',proposal:'КП отправлено',negotiation:'Переговоры',won:'Выигран',lost:'Проигран'};
const pStatus={lead:'Заявка',survey:'Исходные данные',design:'Проектирование',estimate:'Смета',approved:'Согласовано',procurement:'Комплектация',installation:'Монтаж',commissioning:'Пусконаладка',completed:'Завершён',paused:'Пауза',cancelled:'Отменён'};
const st=s=>pStatus[s]||({planned:'Запланирован',in_progress:'В работе',review:'Проверка',done:'Готово',blocked:'Стоп',draft:'Черновик',issued:'Опубликован',paid:'Оплачено',requested:'Запрошено'}[s]||s||'—');
function notice(t,type=''){ $('#notice').innerHTML=t?`<div class="notice ${type}">${esc(t)}</div>`:'' }
async function timedFetch(url,options={},ms=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...options,signal:c.signal})}catch(e){if(e.name==='AbortError')throw Error('Сервер не ответил вовремя. Проверьте интернет и нажмите «Повторить».');throw e}finally{clearTimeout(timer)}}
async function adminCall(action,p={},timeout=12000){const r=await timedFetch(ADMIN_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData:tg?.initData||'',portalToken:token,...p})},timeout);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function clientCall(){const r=await timedFetch(CLIENT_API+'?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||('HTTP '+r.status));e.code=d.error||'';e.payload=d;throw e}return d}
async function upload(action,file,p={}){const f=new FormData();f.append('action',action);f.append('initData',tg?.initData||'');f.append('portalToken',token);f.append('file',file);Object.entries(p).forEach(([k,v])=>f.append(k,String(v??'')));const r=await timedFetch(ADMIN_API,{method:'POST',body:f},45000);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function showShell(){ $('#startup').hidden=true;$('#shell').hidden=false;$('#tabs').hidden=false }
function tabs(items){$('#tabs').style.gridTemplateColumns=`repeat(${items.length},1fr)`;$('#tabs').innerHTML=items.map((x,i)=>`<button class="tab ${S.view==='v'+(i+1)?'on':''}" data-view="v${i+1}"><b>${x[0]}</b>${x[1]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()})}
function setView(){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===S.view))}
function answerValue(k,v){if(v==null||v==='')return'Не указано';if(Array.isArray(v))return v.length?v.map(x=>answerValue(k,x)).join(', '):'Не выбрано';if(typeof v==='object')return Object.entries(v).map(([x,y])=>`${answerLabels[x]||x}: ${answerValue(x,y)}`).join('; ');const raw=String(v),canonical=k==='heatingLayout'?'heating_layout':k==='leakProtection'?'leak':k==='nodePlacement'?'placement':k;return answerValues[`${canonical}:${raw}`]||({'yes':'Да','no':'Нет','true':'Да','false':'Нет'}[raw.toLowerCase()])||raw}
function fmtAnswersHtml(a){if(!a||typeof a!=='object'||!Object.keys(a).length)return'<div class="empty">Ответов на вопросы нет.</div>';return`<dl class="answerList">${Object.entries(a).filter(([k])=>!k.startsWith('_')).map(([k,v])=>`<div class="answerRow"><dt>${esc(answerLabels[k]||k.replaceAll('_',' '))}</dt><dd>${esc(answerValue(k,v))}</dd></div>`).join('')}</dl>`}
function leadAnswers(x){const p=x?.payload||{};if(p.answers&&typeof p.answers==='object')return p.answers;const skip=new Set(['form','stage','flow_slug','submission_id','consent','page_url','referrer','submitted_at','consent_version','preferred_channel','chat_session_id']);return Object.fromEntries(Object.entries(p).filter(([k])=>!skip.has(k)))}
function leadKind(x){return x?.source==='website_chat'?'Сообщение из чата':qname(x?.quiz_type)}
function pipeline(){const a=S.data.pipeline||Object.keys(stageNames);return`<div class="pipeline">${a.map(k=>`<button class="pipe ${S.leadStage===k?'on':''}" data-pipe="${k}">${stageNames[k]} · ${(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===k).length}</button>`).join('')}</div>`}
function leadList(){const a=(S.data.leads||[]).filter(x=>(x.pipeline_stage||'new')===S.leadStage);return`${pipeline()}${a.length?a.map(x=>`<button class="lead" data-lead="${x.id}"><div class="leadTop"><div><h3>${esc(x.name||x.phone||'Без имени')}</h3><p>${esc(leadKind(x))} · ${esc(x.city||'город не указан')} · ${dt(x.created_at)}</p></div><div class="leadValue">${x.estimated_value?money(x.estimated_value):''}</div></div><div class="leadMeta"><span>${esc(sourceNames[x.source]||'Источник не указан')}</span><span>${esc(x.phone||'без телефона')}</span>${x.next_action_at?`<span>Следующее действие: ${dt(x.next_action_at)}</span>`:''}${x.project_id?'<span>Объект уже создан</span>':''}</div></button>`).join(''):'<div class="empty">В этой колонке лидов нет.</div>'}`}
function leadDetail(){const x=S.lead;if(!x)return leadList();const answers=leadAnswers(x),isChat=x.source==='website_chat';return`<button class="back" data-lead-back>← Все обращения</button><div class="hero"><div class="eyebrow">Заявка #${x.id} · ${esc(stageNames[x.pipeline_stage]||x.pipeline_stage)}</div><h1>${esc(x.name||'Клиент')}</h1><p>${esc(leadKind(x))} · ${esc(sourceNames[x.source]||'Источник не указан')}</p><div class="chips"><a class="chip" href="tel:${esc(x.phone||'')}">${esc(x.phone||'Без телефона')}</a>${x.city?`<span class="chip">${esc(x.city)}</span>`:''}</div></div><div class="sectionHead"><h2>${isChat?'Сообщение клиента':'Ответы на вопросы'}</h2><span>${dt(x.created_at)}</span></div>${isChat?`<div class="card">${esc(x.comment||'Сообщение не указано')}</div>`:fmtAnswersHtml(answers)}${x.comment&&!isChat?`<div class="section"><div class="label">Комментарий клиента</div><div class="card">${esc(x.comment)}</div></div>`:''}<div class="section"><div class="sectionHead"><h2>Работа с заявкой</h2></div><div class="card form"><div><div class="label">Этап воронки</div><select class="input" id="leadStage">${Object.entries(stageNames).map(([k,v])=>`<option value="${k}" ${x.pipeline_stage===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form2"><div><div class="label">Потенциал сделки</div><input class="input" id="leadValue" inputmode="decimal" value="${esc(x.estimated_value||'')}" placeholder="₽"></div><div><div class="label">Следующее действие</div><input class="input" id="leadNext" type="datetime-local" value="${x.next_action_at?new Date(x.next_action_at).toISOString().slice(0,16):''}"></div></div><div><div class="label">Мои заметки</div><textarea class="input" id="leadNotes" placeholder="Что обсуждали, что отправить, когда перезвонить">${esc(x.admin_notes||'')}</textarea></div><button class="btn navy w100" id="saveLead">Сохранить заявку</button>${x.project_id?`<button class="btn gold w100" data-open-project="${x.project_id}">Открыть объект</button>`:`<button class="btn gold w100" id="convertLead">Создать объект из заявки</button>`}<button class="btn red w100" id="deleteLead">Удалить заявку навсегда</button></div></div>`}
function accessQueue(){const all=S.data.access_requests||[],pending=all.filter(x=>x.status==='pending'),approved=all.filter(x=>x.status==='approved');const card=x=>{const name=[x.first_name,x.last_name].filter(Boolean).join(' ')||'Без имени',username=x.telegram_username?'@'+x.telegram_username:'username не указан';return`<div class="accessCard"><div class="accessTop"><div><h3>${esc(name)}</h3><p>${esc(username)} · ${esc(x.phone||'телефон не указан')}<br>Запрос: ${dt(x.requested_at)}</p></div><span class="pill ${x.status==='pending'?'gold':x.status==='approved'?'green':'red'}">${x.status==='pending'?'Ожидает':x.status==='approved'?'Разрешён':x.status==='rejected'?'Отклонён':'Отозван'}</span></div><div class="accessActions">${x.status==='pending'? `<button class="btn gold" data-access-review="${x.id}" data-access-status="approved">Разрешить</button><button class="btn red" data-access-review="${x.id}" data-access-status="rejected">Отклонить</button>` : x.status==='approved'? `<button class="btn red" data-access-review="${x.id}" data-access-status="revoked">Отозвать доступ</button>` : `<button class="btn light" data-access-review="${x.id}" data-access-status="approved">Разрешить</button>`}</div></div>`};return`<div class="section"><div class="sectionHead"><h2>Доступ к Mini App</h2><span>Закрытый режим · ждут: ${pending.length}</span></div>${pending.length?pending.map(card).join(''):'<div class="empty">Новых запросов на доступ нет.</div>'}${approved.length?`<details style="margin-top:8px"><summary class="btn light w100">Разрешённые пользователи · ${approved.length}</summary><div style="margin-top:8px">${approved.map(card).join('')}</div></details>`:''}</div>`}
function adminLeads(){const leads=S.data.leads||[],projects=S.data.projects||[],requests=S.data.access_requests||[],fresh=leads.filter(x=>(x.pipeline_stage||'new')==='new').length,pending=requests.filter(x=>x.status==='pending').length;return`<div class="hero adminHero"><div class="eyebrow"><span class="liveDot"></span> Рабочая CRM · закрытый доступ</div><h1>Управление Timchenko.pro</h1><p>Реальные заявки сайта и Telegram, объекты, этапы, документы, фото и оплаты. Новые пользователи входят только после вашего подтверждения.</p><div class="adminStats"><div><small>Ждут доступа</small><b>${pending}</b></div><div><small>Новые заявки</small><b>${fresh}</b></div><div><small>Все лиды</small><b>${leads.length}</b></div><div><small>Объекты</small><b>${projects.length}</b></div></div></div>${accessQueue()}${S.lead?leadDetail():`<div class="section"><div class="sectionHead"><h2>Лиды и обращения</h2><span>${leads.length}</span></div>${leadList()}</div>`}`}
function projectList(){const a=S.data.projects||[];return`<div class="hero"><div class="eyebrow">Управление объектами</div><h1>Проекты и стройка</h1><p>Исходные данные, этапы, сметы, оплаты, документы и фотоотчёты.</p><div class="chips"><span class="chip">${a.length} объектов</span></div></div>${a.length?a.map(p=>`<button class="projectBtn" data-open-project="${p.id}"><div class="leadTop"><div><h3>${esc(p.title)}</h3><p>${esc(p.client?[p.client.first_name,p.client.last_name].filter(Boolean).join(' '):'Клиент не привязан')} · ${esc(p.city||p.address||'')}</p></div><span class="pill">${esc(st(p.status))}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div><div class="projectFoot"><span>${p.progress_percent||0}% · ${esc(p.current_stage||'')}</span><span>${p.document_count||0} док. · ${p.media_count||0} фото</span></div></button>`).join(''):'<div class="empty">Объектов пока нет. Конвертируйте первый лид.</div>'}`}
function objectAssets(d){const stages=d.stages||[],sid=S.stageId,docs=(d.documents||[]).filter(x=>(x.stage_id||'')===sid),media=(d.media||[]).filter(x=>(x.stage_id||'')===sid),pay=(d.payments||[]).filter(x=>(x.stage_id||'')===sid),est=(d.estimates||[]).filter(x=>(x.stage_id||'')===sid);return`<div class="section"><div class="sectionHead"><h2>Управление выбранным этапом</h2><span>${sid?esc(stages.find(x=>x.id===sid)?.name||'этап'):'Весь объект'}</span></div><div class="assetNav"><button class="${S.asset==='photos'?'on':''}" data-asset="photos">📷 Фото ${media.length}</button><button class="${S.asset==='docs'?'on':''}" data-asset="docs">📄 Документы ${docs.length}</button><button class="${S.asset==='pay'?'on':''}" data-asset="pay">₽ Оплаты ${pay.length}</button><button class="${S.asset==='est'?'on':''}" data-asset="est">∑ Сметы ${est.length}</button></div>${S.asset==='photos'?photoAdmin(media):S.asset==='docs'?docsAdmin(docs):S.asset==='pay'?payAdmin(pay):estimateAdmin(est)}</div>`}
function visSwitch(){return`<label class="switch"><input type="checkbox" id="pubClient"> Показать клиенту сразу</label>`}
function photoAdmin(a){return`<div class="card form"><div><div class="label">Фото отчёта</div><input class="input fileInput" type="file" id="photoFile" accept="image/jpeg,image/png,image/webp"></div><input class="input" id="photoCaption" placeholder="Комментарий: опрессовка, скрытые работы…">${visSwitch()}<button class="btn navy w100" id="uploadPhoto">Загрузить фото</button></div><div class="sectionHead" style="margin-top:10px"><h2>Фото этого этапа</h2></div>${a.length?`<div class="thumbGrid">${a.map(x=>`<div class="thumb"><b>${esc(x.file_name||'Фото')}</b><small>${x.visibility==='client'?'Клиент видит':'Только команда'} · ${dt(x.created_at)}</small><button class="btn light vis" data-entity="media" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}" style="margin-top:6px">${x.visibility==='client'?'Скрыть':'Опубликовать'}</button></div>`).join('')}</div>`:'<div class="empty">Фото на этом этапе ещё нет.</div>'}`}
function docsAdmin(a){return`<div class="card form"><div><div class="label">Файл документа</div><input class="input fileInput" type="file" id="docFile" accept=".pdf,.xlsx,.xls,.docx,.doc,.csv"></div><div class="form2"><input class="input" id="docTitle" placeholder="Название документа"><select class="input" id="docType"><option value="project">Проект</option><option value="estimate">Смета</option><option value="proposal">КП</option><option value="contract">Договор</option><option value="act">Акт</option><option value="invoice">Счёт</option><option value="receipt">Чек</option><option value="specification">Спецификация</option><option value="other">Другое</option></select></div>${visSwitch()}<button class="btn navy w100" id="uploadDoc">Загрузить документ</button></div><div class="sectionHead" style="margin-top:10px"><h2>Документы этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><button class="btn light vis" data-entity="document" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div>`).join(''):'<div class="empty">Документов на этом этапе нет.</div>'}`}
function payAdmin(a){return`<div class="card form"><div class="form2"><div><div class="label">Сумма</div><input class="input" id="payAmount" inputmode="decimal" placeholder="₽"></div><div><div class="label">Срок оплаты</div><input class="input" id="payDue" type="date"></div></div><input class="input" id="payNote" placeholder="Например: аванс за этап монтажа"><select class="input" id="payStatus"><option value="planned">Запланировано</option><option value="requested">Запрошено</option><option value="paid">Оплачено</option></select><button class="btn navy w100" id="addPay">Добавить этап оплаты</button></div><div class="sectionHead" style="margin-top:10px"><h2>Оплаты этого этапа</h2></div>${a.length?a.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||x.payment_type||'')} · ${dt(x.paid_at||x.due_date||x.created_at)}</small></div><div style="display:flex;gap:5px;align-items:center"><span class="pill">${esc(st(x.status))}</span>${x.status!=='paid'?`<button class="btn light markPaid" data-id="${x.id}">Оплачено</button>`:''}</div></div>`).join(''):'<div class="empty">Оплат на этом этапе нет.</div>'}`}
function estimateAdmin(a){return`<div class="card form"><input class="input" id="estTitle" value="Смета по этапу" placeholder="Название сметы">${visSwitch()}<button class="btn navy w100" id="addEst">Создать смету</button><div style="font-size:9px;color:var(--muted)">После создания смета появляется в общей базе. Наполнение материалами/работами продолжим через единый сметный движок.</div></div><div class="sectionHead" style="margin-top:10px"><h2>Сметы этого этапа</h2></div>${a.length?a.map(x=>{const t=Number(x.labor_total||0)+Number(x.mat_total||0)+Number(x.equipment_total||0)-Number(x.discount_total||0);return`<div class="row"><div><strong>${esc(x.title)}</strong><small>v${x.version||1} · ${esc(st(x.status))}</small></div><div style="text-align:right"><b>${money(t)}</b><button class="btn light vis" data-entity="estimate" data-id="${x.id}" data-vis="${x.visibility==='client'?'team':'client'}" style="display:block;margin-top:4px">${x.visibility==='client'?'Скрыть':'Клиенту'}</button></div></div>`}).join(''):'<div class="empty">Смет на этом этапе нет.</div>'}`}
function projectDetail(){const d=S.project;if(!d)return projectList();const p=d.project,src=p.source_data||{},stages=d.stages||[];if(S.stageId&&!stages.some(x=>x.id===S.stageId))S.stageId='';return`<button class="back" data-project-back>← Все объекты</button><div class="hero"><div class="eyebrow">Объект · ${esc(st(p.status))}</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||'')} · ${Number(p.progress_percent||0)}%</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}${d.client?`<span class="chip">${esc([d.client.first_name,d.client.last_name].filter(Boolean).join(' '))}</span>`:''}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="card form"><div class="form2"><input class="input" id="pTitle" value="${esc(p.title)}" placeholder="Название"><select class="input" id="pStatus">${Object.entries(pStatus).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form3"><input class="input" id="pCity" value="${esc(p.city||'')}" placeholder="Город"><input class="input" id="pArea" inputmode="decimal" value="${esc(p.area_m2||'')}" placeholder="м²"><input class="input" id="pProgress" inputmode="numeric" value="${esc(p.progress_percent||0)}" placeholder="%"></div><input class="input" id="pAddress" value="${esc(p.address||'')}" placeholder="Адрес"><div class="form2"><input class="input" id="pStage" value="${esc(p.current_stage||'')}" placeholder="Текущий этап"><input class="input" id="pBudget" inputmode="decimal" value="${esc(p.budget_estimate||'')}" placeholder="Бюджет ₽"></div><button class="btn navy w100" id="saveProject">Сохранить объект</button></div>${src.lead_id?`<div class="section"><div class="sectionHead"><h2>Ответы клиента</h2><span>из заявки #${src.lead_id}</span></div>${fmtAnswersHtml(src.answers||src.payload?.answers||{})}</div>`:''}<div class="section"><div class="sectionHead"><h2>Этапы работ</h2><button class="btn light" id="newStage">＋ Этап</button></div>${stages.length?stages.map(s=>`<div class="stageCard ${S.stageId===s.id?'active':''}"><div class="stageTop"><div><h3>${esc(s.name)}</h3><p>${esc(s.system||'')} · ${s.planned_finish?'до '+dt(s.planned_finish):'срок не задан'}</p></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div><div class="stageActions"><button class="btn ${S.stageId===s.id?'gold':'light'}" data-stage-select="${s.id}">${S.stageId===s.id?'Выбран':'Управлять'}</button><button class="btn light" data-stage-edit="${s.id}">Изменить</button><span class="pill">${esc(st(s.status))}</span>${s.budget_amount?`<span class="pill">${money(s.budget_amount)}</span>`:''}</div></div>`).join(''):'<div class="empty">Этапов пока нет.</div>'}</div>${objectAssets(d)}<div class="dangerZone"><h2>Удаление ошибочного объекта</h2><p>Объект, его этапы, оплаты, документы и фото будут удалены навсегда. Связанные заявки и ответы квиза сохранятся без привязки к объекту.</p><button class="btn red w100" id="deleteProject">Удалить объект навсегда</button></div>`}
function adminObjects(){return S.project?projectDetail():projectList()}
function adminProfile(){const a=S.data.admin||{};return`<div class="hero"><div class="eyebrow"><span class="liveDot"></span> Доступ подтверждён</div><h1>Панель владельца</h1><p>Рабочий режим открывается только вашему Telegram-аккаунту, зарегистрированному в platform_admins.</p></div><div class="card profile"><h2>${esc(a.display_name||'Владелец')}</h2><p class="verified">✓ Полный административный доступ</p><p>Лиды → объекты → этапы → сметы → оплаты → документы → фотоотчёты.</p><div class="securityNote">Telegram подтверждает личность при каждом запуске. Секретные ключи и права администратора не передаются в браузер.</div></div>`}
function renderAdmin(){ $('#modeTitle').textContent='Рабочая панель · владелец';$('#v1').innerHTML=adminLeads();$('#v2').innerHTML=adminObjects();$('#v3').innerHTML=adminProfile();setView();tabs([['◎','Лиды'],['🏗','Объекты'],['👤','Админ']]);bindAdmin() }
async function reloadAdmin(keep=true){const d=await adminCall('bootstrap');S.data=d;if(!keep){S.lead=null;S.project=null;S.stageId=''}renderAdmin()}
async function openProject(id){notice('Загружаю объект…');S.project=await adminCall('project.detail',{project_id:id});S.stageId=S.project.stages?.[0]?.id||'';S.view='v2';notice('');renderAdmin()}
function bindAdmin(){document.querySelectorAll('[data-access-review]').forEach(b=>b.onclick=async()=>{const status=b.dataset.accessStatus,label=status==='approved'?'разрешить доступ':status==='rejected'?'отклонить запрос':'отозвать доступ';if(status!=='approved'&&!confirm('Точно '+label+'?'))return;b.disabled=true;try{await adminCall('access.review',{request_id:b.dataset.accessReview,status});notice(status==='approved'?'Доступ подтверждён':'Решение сохранено','ok');await reloadAdmin()}catch(x){notice(x.message,'error');b.disabled=false}});document.querySelectorAll('[data-pipe]').forEach(b=>b.onclick=()=>{S.leadStage=b.dataset.pipe;S.lead=null;renderAdmin()});document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{S.lead=(S.data.leads||[]).find(x=>String(x.id)===String(b.dataset.lead));renderAdmin()});document.querySelector('[data-lead-back]')?.addEventListener('click',()=>{S.lead=null;renderAdmin()});document.querySelectorAll('[data-open-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.openProject));document.querySelector('[data-project-back]')?.addEventListener('click',()=>{S.project=null;S.stageId='';renderAdmin()});
 $('#saveLead')?.addEventListener('click',async e=>{e.target.disabled=true;try{const next=$('#leadNext').value;await adminCall('lead.update',{lead_id:S.lead.id,pipeline_stage:$('#leadStage').value,estimated_value:$('#leadValue').value,admin_notes:$('#leadNotes').value,next_action_at:next?new Date(next).toISOString():null});notice('Лид сохранён','ok');const id=S.lead.id;await reloadAdmin();S.lead=(S.data.leads||[]).find(x=>x.id===id);renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#deleteLead')?.addEventListener('click',async e=>{const name=S.lead?.name||S.lead?.phone||('заявка #'+S.lead?.id);if(!confirm('Удалить заявку «'+name+'» навсегда? Объект, если он уже создан, останется.'))return;e.target.disabled=true;try{await adminCall('lead.delete',{lead_id:S.lead.id});S.lead=null;notice('Заявка удалена','ok');await reloadAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#convertLead')?.addEventListener('click',async e=>{if(!confirm('Создать объект и привязать к нему данные этого квиза?'))return;e.target.disabled=true;try{const d=await adminCall('lead.convert',{lead_id:S.lead.id});notice('Объект создан из лида','ok');await reloadAdmin();S.project=d;S.lead=null;S.view='v2';S.stageId=d.stages?.[0]?.id||'';renderAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#saveProject')?.addEventListener('click',async e=>{e.target.disabled=true;try{const pid=S.project.project.id;await adminCall('project.update',{project_id:pid,title:$('#pTitle').value,status:$('#pStatus').value,city:$('#pCity').value,address:$('#pAddress').value,area_m2:$('#pArea').value||null,progress_percent:$('#pProgress').value||0,current_stage:$('#pStage').value,budget_estimate:$('#pBudget').value||null});notice('Объект обновлён','ok');await openProject(pid);await reloadAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#deleteProject')?.addEventListener('click',async e=>{const p=S.project?.project;if(!p)return;const phrase=prompt(`Вы удаляете объект «${p.title}» со всеми этапами, оплатами, документами и фото.\n\nДля подтверждения введите: УДАЛИТЬ ОБЪЕКТ`,'');if(phrase===null)return;if(phrase.trim()!=='УДАЛИТЬ ОБЪЕКТ')return notice('Удаление отменено: контрольная фраза введена неверно.','error');e.target.disabled=true;try{const d=await adminCall('project.delete',{project_id:p.id,project_title:p.title,confirm_text:phrase.trim()});S.project=null;S.stageId='';notice(d.cleanup_warnings?.length?'Объект удалён. Некоторые файлы требуют дополнительной очистки.':'Объект удалён навсегда. Заявки и ответы квиза сохранены.','ok');await reloadAdmin()}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#newStage')?.addEventListener('click',async()=>{const name=prompt('Название этапа','Новый этап');if(!name)return;try{const d=await adminCall('stage.create',{project_id:S.project.project.id,name,sort_order:(S.project.stages?.length||0)*10+10,visibility:'client'});notice('Этап добавлен','ok');await openProject(S.project.project.id);S.stageId=d.stage.id;renderAdmin()}catch(x){notice(x.message,'error')}});
 document.querySelectorAll('[data-stage-select]').forEach(b=>b.onclick=()=>{S.stageId=b.dataset.stageSelect;renderAdmin()});document.querySelectorAll('[data-stage-edit]').forEach(b=>b.onclick=async()=>{const s=S.project.stages.find(x=>x.id===b.dataset.stageEdit);if(!s)return;const name=prompt('Название этапа',s.name);if(name===null)return;const progress=prompt('Готовность, %',String(s.progress_percent||0));if(progress===null)return;const status=prompt('Статус: planned / in_progress / review / done / blocked',s.status||'planned');if(status===null)return;try{await adminCall('stage.update',{stage_id:s.id,name,progress_percent:Number(progress)||0,status});notice('Этап обновлён','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}});
 document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.asset=b.dataset.asset;renderAdmin()});
 $('#uploadPhoto')?.addEventListener('click',async e=>{const f=$('#photoFile').files?.[0];if(!f)return notice('Выберите фото','error');e.target.disabled=true;try{await upload('upload_media',f,{project_id:S.project.project.id,stage_id:S.stageId,caption:$('#photoCaption').value,visibility:$('#pubClient').checked?'client':'team'});notice('Фото загружено','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#uploadDoc')?.addEventListener('click',async e=>{const f=$('#docFile').files?.[0];if(!f)return notice('Выберите документ','error');e.target.disabled=true;try{await upload('upload_document',f,{project_id:S.project.project.id,stage_id:S.stageId,title:$('#docTitle').value||f.name,document_type:$('#docType').value,visibility:$('#pubClient').checked?'client':'team'});notice('Документ загружен','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 $('#addPay')?.addEventListener('click',async e=>{if(!Number($('#payAmount').value))return notice('Введите сумму','error');e.target.disabled=true;try{await adminCall('payment.create',{project_id:S.project.project.id,stage_id:S.stageId||null,amount:$('#payAmount').value,due_date:$('#payDue').value||null,note:$('#payNote').value,status:$('#payStatus').value});notice('Этап оплаты добавлен','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 document.querySelectorAll('.markPaid').forEach(b=>b.onclick=async()=>{try{await adminCall('payment.update',{payment_id:b.dataset.id,status:'paid'});notice('Оплата отмечена','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}});
 $('#addEst')?.addEventListener('click',async e=>{e.target.disabled=true;try{await adminCall('estimate.create',{project_id:S.project.project.id,stage_id:S.stageId||null,title:$('#estTitle').value||'Смета',visibility:$('#pubClient').checked?'client':'team'});notice('Смета создана','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error');e.target.disabled=false}});
 document.querySelectorAll('.vis').forEach(b=>b.onclick=async()=>{try{await adminCall('visibility.update',{entity:b.dataset.entity,id:b.dataset.id,visibility:b.dataset.vis});notice(b.dataset.vis==='client'?'Опубликовано клиенту':'Скрыто от клиента','ok');await openProject(S.project.project.id)}catch(x){notice(x.message,'error')}})
}
function cp(){return S.data?.projects?.[S.clientProject]||null}function clientSelect(){const a=S.data?.projects||[];if(a.length<2)return'';return`<select class="input" id="cpSel" style="margin-top:10px">${a.map((x,i)=>`<option value="${i}" ${i===S.clientProject?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}
function clientStages(p){const stages=p?.stages||[];if(!stages.length)return'<div class="empty">Этапы появятся после планирования.</div>';return stages.map(s=>{const docs=(p.documents||[]).filter(x=>x.stage_id===s.id),media=(p.media||[]).filter(x=>x.stage_id===s.id),pay=(p.payments||[]).filter(x=>x.stage_id===s.id),est=(p.estimates||[]).filter(x=>x.stage_id===s.id);return`<details class="clientStage" ${s.status==='in_progress'?'open':''}><summary><div class="stageSummary"><div class="stageSummaryTop"><div><b>${esc(s.name)}</b><small>${esc(s.description||s.system||'')}${s.planned_finish?' · до '+dt(s.planned_finish):''}</small></div><span class="pill">${Number(s.progress_percent||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(s.progress_percent||0)))}%"></i></div></div></summary><div class="stageBody">${est.length?`<h4>Сметы</h4>${est.map(e=>{const t=Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0);return`<div class="row"><div><strong>${esc(e.title)}</strong><small>v${e.version||1}</small></div><b>${money(t)}</b></div>`}).join('')}`:''}${pay.length?`<h4>Оплаты</h4>${pay.map(x=>`<div class="row"><div><strong>${money(x.amount)}</strong><small>${esc(x.note||'')} · ${dt(x.paid_at||x.due_date)}</small></div><span class="pill">${esc(st(x.status))}</span></div>`).join('')}`:''}${docs.length?`<h4>Документы</h4>${docs.map(x=>`<a class="row link" ${x.url?`href="${esc(x.url)}" target="_blank"`:''}><div><strong>${esc(x.title)}</strong><small>${esc(x.document_type)} · ${dt(x.updated_at)}</small></div><span class="pill">${x.url?'Открыть':esc(st(x.status))}</span></a>`).join('')}`:''}${media.length?`<h4>Фотоотчёт</h4><div class="thumbGrid clientPhotos">${media.filter(x=>x.url).map(x=>`<a class="photo" href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" loading="lazy">${x.caption?`<div class="photoCap">${esc(x.caption)}</div>`:''}</a>`).join('')}</div>`:''}${!est.length&&!pay.length&&!docs.length&&!media.length?'<div class="empty">Материалы по этапу ещё не опубликованы.</div>':''}</div></details>`}).join('')}
function quizLauncher(){return`<div class="section"><div class="sectionHead"><h2>Новый расчёт</h2><span>Можно проходить повторно</span></div><div class="quizGrid"><button class="quizBtn" data-quiz="engineering_nodes"><b>💧</b><strong>Узел ввода воды</strong><small>Комплектация и предварительный расчёт</small></button><button class="quizBtn" data-quiz="home_engineering"><b>🏡</b><strong>Инженерные системы</strong><small>Отопление, вода и коммуникации дома</small></button><button class="quizBtn" data-quiz="electrical"><b>⚡</b><strong>Электрика</strong><small>Исходные данные по электроснабжению</small></button></div></div>`}
function clientObject(){const p=cp(),quizzes=S.data?.quizzes||[];if(!p){const waiting=quizzes.some(x=>!x.project_id);return`<div class="hero"><div class="eyebrow">Личный кабинет</div><h1>${waiting?'Ожидается ответ':'Начните с расчёта'}</h1><p>${waiting?'Ваши исходные данные получены. Специалист изучит их и свяжется с вами; после создания объекта он появится здесь автоматически.':'У вас пока нет объекта или отправленного расчёта. Выберите подходящий квиз — пройти его можно несколько раз.'}</p><div class="chips">${waiting?'<span class="chip">Заявка принята</span><span class="chip">Ожидается ответ</span>':'<span class="chip">Квиз занимает несколько минут</span>'}</div></div>${quizLauncher()}`};return`<div class="hero"><div class="eyebrow">Мой объект</div><h1>${esc(p.title)}</h1><p>${esc(p.current_stage||st(p.status))}</p><div class="chips">${p.area_m2?`<span class="chip">${p.area_m2} м²</span>`:''}${p.city?`<span class="chip">${esc(p.city)}</span>`:''}<span class="chip">${esc(st(p.status))}</span></div>${clientSelect()}<div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(p.progress_percent||0)))}%"></i></div></div><div class="grid g3"><div class="metric"><small>Готовность</small><b>${p.progress_percent||0}%</b></div><div class="metric"><small>Бюджет</small><b>${p.budget_estimate?money(p.budget_estimate):'—'}</b></div><div class="metric"><small>Оплачено</small><b>${p.paid_amount?money(p.paid_amount):'—'}</b></div></div><div class="section"><div class="sectionHead"><h2>Этапы работ</h2><span>Фото и документы по этапам</span></div>${clientStages(p)}</div>`}
function clientQuizzes(){const a=S.data?.quizzes||[];return`<div class="hero"><div class="eyebrow">Расчёты КП</div><h1>Ваши исходные данные</h1><p>После отправки расчёт получает статус «Ожидается ответ». Вы можете пройти любой квиз повторно — каждое прохождение сохранится отдельно.</p></div>${a.length?a.map(x=>`<div class="row"><div><strong>${esc(qname(x.quiz_type))}</strong><small>${dt(x.created_at)}</small></div><span class="pill ${x.project_id?'green':'gold'}">${x.project_id?'В объекте':'Ожидается ответ'}</span></div>`).join(''):'<div class="empty">Вы ещё не проходили квизы. Выберите расчёт ниже.</div>'}${quizLauncher()}`}
function clientProfile(){const u=S.data?.profile||{};return`<div class="hero"><div class="eyebrow">Заказчик</div><h1>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Профиль')}</h1><p>Здесь видны только ваши объекты и опубликованные для вас материалы.</p></div><div class="card profile"><p>${esc(u.phone||'')}</p><p>${esc(u.email||'')}</p><p class="verified">${S.data?.identity?.phone_verified?'✓ Номер подтверждён':'Профиль связан с объектом'}</p></div>`}
function renderClient(){ $('#modeTitle').textContent='Личный кабинет заказчика';$('#v1').innerHTML=clientObject();$('#v2').innerHTML=clientQuizzes();$('#v3').innerHTML=clientProfile();setView();tabs([['🏗','Объект'],['∑','Расчёты'],['👤','Профиль']]);$('#cpSel')?.addEventListener('change',e=>{S.clientProject=Number(e.target.value);renderClient()});document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const url='https://t.me/uzelpro_bot?start=quiz_'+b.dataset.quiz;if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url}) }
function renderAccessGate(code){S.mode='gate';$('#startup').hidden=true;$('#shell').hidden=false;$('#modeTitle').textContent='Доступ к кабинету';$('#tabs').hidden=true;const rejected=code==='access_rejected'||code==='access_revoked';$('#v1').innerHTML=`<div class="hero gateHero"><div class="gateIcon">${rejected?'⛔':'🔐'}</div><div class="eyebrow">Timchenko.pro · закрытый доступ</div><h1>${rejected?'Доступ не предоставлен':'Запрос отправлен'}</h1><p>${rejected?'Владелец пока не подтвердил доступ к кабинету. Свяжитесь с Timchenko.pro, если считаете это ошибкой.':'Ваш запрос уже видит владелец. После личного подтверждения доступ откроется автоматически.'}</p></div><div class="card"><strong>${rejected?'Что делать':'Что дальше'}</strong><p style="font-size:10px;color:var(--muted);line-height:1.55;margin-bottom:0">${rejected?'Свяжитесь с владельцем и дождитесь решения.':'Владелец свяжется с вами, проверит данные и подтвердит вход. После уведомления нажмите «Обновить» или откройте кабинет из бота ещё раз.'}</p></div>`}
async function boot(){try{$('#startup').hidden=false;if(tg?.initData){try{const d=await adminCall('bootstrap',{},8000);if(d?.mode==='admin'){S.mode='admin';S.data=d;showShell();renderAdmin();return}}catch(e){if(e.message!=='ADMIN_ONLY'&&e.message!=='TELEGRAM_AUTH_REQUIRED'&&!e.message.includes('403'))console.warn('Admin probe',e)}}if(!token)throw Error('Откройте кабинет из новой кнопки «Мой объект» в @uzelpro_bot.');S.mode='client';S.data=await clientCall();showShell();renderClient()}catch(e){if(['access_pending','access_rejected','access_revoked'].includes(e.code||e.message)){renderAccessGate(e.code||e.message);return}$('#startup').hidden=true;$('#shell').hidden=false;$('#modeTitle').textContent='Кабинет';$('#v1').innerHTML=`<div class="hero"><div class="eyebrow">Timchenko.pro</div><h1>Не удалось проверить доступ</h1><p>${esc(e.message)}</p></div><div class="card bootError"><strong>Проверка остановлена</strong><p style="font-size:10px;color:var(--muted);line-height:1.55">Индикатор больше не будет крутиться бесконечно. Проверьте интернет и повторите запрос или откройте кабинет из свежей кнопки бота.</p><button class="btn navy w100" id="retryBoot">Повторить проверку</button></div>`;$('#tabs').hidden=true;$('#retryBoot').onclick=()=>{location.reload()}}}
$('#refreshBtn').onclick=async()=>{notice('Обновляю…');try{if(S.mode==='admin')await reloadAdmin();else if(S.mode==='gate')await boot();else{S.data=await clientCall();renderClient()}notice('Обновлено','ok')}catch(e){if(['access_pending','access_rejected','access_revoked'].includes(e.code||e.message))renderAccessGate(e.code||e.message);else notice(e.message,'error')}};$('#homeBtn').onclick=()=>{S.view='v1';S.lead=null;S.project=null;render()};
function render(){if(S.mode==='admin')renderAdmin();else if(S.mode==='client')renderClient()}
boot();
})();
</script>
</body></html>
