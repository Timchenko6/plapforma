<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timchenko.pro · загрузка</title><style>body{margin:0;background:#eef2f6;color:#13233b;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.x{text-align:center}.s{width:34px;height:34px;border:3px solid #d6dee9;border-top-color:#bf9000;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 12px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="x"><div class="s"></div>Загружаем Timchenko.pro…</div><script>(async()=>{try{const names=['payload/part-1.txt','payload/part-2.txt','payload/part-3.txt'];const txt=(await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})))).join('');const bin=Uint8Array.from(atob(txt),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('browser_no_gzip');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="x"><b>Не удалось открыть тестовую версию</b><br><small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
