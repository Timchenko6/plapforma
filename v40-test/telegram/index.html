<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1530">
<title>Timchenko.pro · кабинет заказчика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--n:#0b1530;--n2:#18305a;--g:#bf9000;--gl:#dfb635;--bg:#eef2f6;--card:#fff;--ink:#13233b;--m:#6a788b;--line:#d7dfe9;--ok:#27845d;--safe:env(safe-area-inset-bottom,0px);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}button,a{font:inherit}.app{max-width:760px;margin:auto;padding:12px 12px calc(88px + var(--safe))}.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 13px;gap:12px}.brand{font-size:22px;font-weight:850;letter-spacing:-.045em}.brand b{color:var(--g)}.sub{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--m);margin-top:2px}.who{font-size:10px;color:var(--m);text-align:right}.hero{background:linear-gradient(145deg,var(--n),#203861);color:#fff;border-radius:24px;padding:19px;box-shadow:0 18px 45px rgba(11,21,48,.15)}.eyebrow{font:700 9px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:#e8cb6b}.hero-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero h1{font-size:26px;line-height:1.04;letter-spacing:-.04em;margin:7px 0 4px}.hero p{margin:0;color:#bfcbdd;font-size:11px;line-height:1.5}.state{font-size:9px;font-weight:800;padding:6px 8px;border-radius:99px;background:rgba(46,155,104,.18);border:1px solid rgba(117,224,172,.35);color:#a8f1cd;white-space:nowrap}.progress{margin-top:16px}.progress-line{display:flex;justify-content:space-between;font-size:10px;color:#c5d0df;margin-bottom:6px}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--gl));border-radius:99px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.metric{padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.055)}.metric span{display:block;color:#aebbd0;font-size:8px;text-transform:uppercase;letter-spacing:.08em}.metric b{display:block;margin-top:4px;font-size:13px}.section{display:flex;align-items:end;justify-content:space-between;margin:18px 2px 8px}.section h2{font-size:17px;margin:0}.section span{font-size:10px;color:var(--m)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stage{display:grid;grid-template-columns:23px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f5}.stage:last-child{border:0}.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:#e8edf3;color:#78879a}.stage.done .dot{background:#def3e9;color:var(--ok)}.stage.active .dot{background:#fff4cf;color:#856600}.stage b{font-size:12px}.stage small{display:block;color:var(--m);font-size:9px;margin-top:2px}.pct{font-size:10px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{background:#dfe6ed;border-radius:16px;overflow:hidden;min-height:130px;position:relative}.photo img{width:100%;height:150px;object-fit:cover;display:block}.photo div{padding:9px 10px;background:#fff}.photo b{font-size:11px}.photo small{display:block;color:var(--m);font-size:9px}.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f5}.doc:last-child{border:0}.doc b{font-size:12px}.doc small{display:block;color:var(--m);font-size:9px;margin-top:2px}.doc a{color:var(--n);font-size:10px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 9px}.empty{border:1px dashed #bac6d3;border-radius:18px;padding:24px 16px;text-align:center;color:var(--m);font-size:11px;line-height:1.55;background:rgba(255,255,255,.5)}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.btn{display:flex;justify-content:center;align-items:center;min-height:46px;border-radius:13px;text-decoration:none;font-weight:750;font-size:11px}.btn.navy{background:var(--n);color:#fff}.tabs{position:fixed;bottom:calc(8px + var(--safe));left:50%;transform:translateX(-50%);width:min(740px,calc(100% - 18px));padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:rgba(11,21,48,.97);border-radius:19px;z-index:20}.tab{border:0;background:transparent;color:#9baac0;border-radius:12px;padding:7px 3px;font-size:8px}.tab b{display:block;font-size:15px;margin-bottom:2px}.tab.on{background:rgba(255,255,255,.11);color:#fff}.screen{display:none}.screen.on{display:block}.notice{margin-bottom:10px;border:1px solid #e6cf87;background:#fff8e6;color:#705400;border-radius:14px;padding:10px;font-size:10px;line-height:1.45}@media(max-width:380px){.hero h1{font-size:23px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tabs{width:calc(100% - 12px)}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div><div class="brand">Timchenko<b>.pro</b></div><div class="sub">Telegram · личный кабинет заказчика</div></div><div class="who" id="who">загрузка…</div></div>
<div id="notice"></div>
<section class="screen on" id="home"></section>
<section class="screen" id="stages"></section>
<section class="screen" id="photos"></section>
<section class="screen" id="docs"></section>
</main>
<nav class="tabs" id="tabs"></nav>
<script>
(()=>{
const tg=window.Telegram?.WebApp||null;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0b1530')}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n||0))+' ₽';
const preview=!tg?.initData;let data=null,screen='home';
const demo={user:{first_name:'Заказчик'},client:{name:'Заказчик'},project:{id:26,title:'Объект №026 · Дом 285 м²',city:'Краснодар',area_m2:285,current_stage:'Монтаж инженерных систем',progress_percent:63,client_budget:3480000,client_paid:2436000},stages:[{name:'Проект и спецификация',status:'done',progress_percent:100},{name:'Комплектация',status:'done',progress_percent:100},{name:'Монтаж котельной и коллекторов',status:'active',progress_percent:63},{name:'Электрика и автоматика',status:'planned',progress_percent:0},{name:'Пусконаладка и сдача',status:'planned',progress_percent:0}],media:[],documents:[]};
function stateLabel(s){return s==='done'?'готово':s==='active'?'в работе':'впереди'}
function hero(){const p=data.project,pr=Number(p.progress_percent||0),budget=Number(p.client_budget||0),paid=Number(p.client_paid||0);return `<div class="hero"><div class="hero-head"><div><div class="eyebrow">Кабинет объекта</div><h1>${esc(p.title)}</h1><p>${esc(p.city||'')}${p.area_m2?' · '+p.area_m2+' м²':''}<br>${esc(p.current_stage||'')}</p></div><span class="state">В РАБОТЕ</span></div><div class="progress"><div class="progress-line"><span>Готовность объекта</span><b>${pr}%</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,pr))}%"></i></div></div><div class="metrics"><div class="metric"><span>Этап</span><b>${esc(p.current_stage||'—')}</b></div><div class="metric"><span>Бюджет</span><b>${budget?money(budget):'по договору'}</b></div><div class="metric"><span>Оплачено</span><b>${budget&&paid?Math.round(paid/budget*100)+'%':'—'}</b></div></div></div>`}
function noProject(){return `<div class="hero"><div class="eyebrow">Timchenko.pro</div><h1>Ваш кабинет готов</h1><p>После привязки объекта здесь появятся ход работ, фото скрытых узлов, документы и клиентская информация по вашему дому.</p></div><div class="section"><h2>Пока объекта нет</h2></div><div class="empty"><b>Объект ещё не привязан к Telegram</b>Если вы уже являетесь заказчиком Timchenko.pro, напишите инженеру — мы привяжем объект к вашему аккаунту.</div><div style="height:10px"></div><a class="btn navy" href="https://t.me/uzelpro_bot">Написать в Timchenko.pro</a>`}
function home(){if(!data.project)return noProject();return hero()+`<div class="section"><h2>Что сейчас</h2><span>${data.stages.filter(x=>x.status==='done').length}/${data.stages.length} этапов</span></div><div class="card">${data.stages.slice(0,4).map((x,i)=>`<div class="stage ${x.status}"><span class="dot">${x.status==='done'?'✓':i+1}</span><div><b>${esc(x.name)}</b><small>${stateLabel(x.status)}</small></div><span class="pct">${Number(x.progress_percent||0)}%</span></div>`).join('')}</div><div class="section"><h2>Фото и документы</h2></div><div class="grid"><button class="card" data-go="photos" style="text-align:left;border:1px solid var(--line)"><b>📷 Фотоотчёт</b><small style="display:block;color:var(--m);margin-top:5px">${data.media.length} материалов</small></button><button class="card" data-go="docs" style="text-align:left;border:1px solid var(--line)"><b>📄 Документы</b><small style="display:block;color:var(--m);margin-top:5px">${data.documents.length} файлов</small></button></div>`}
function stages(){if(!data.project)return noProject();return hero()+`<div class="section"><h2>Ход работ</h2><span>по вашему объекту</span></div><div class="card">${data.stages.length?data.stages.map((x,i)=>`<div class="stage ${x.status}"><span class="dot">${x.status==='done'?'✓':i+1}</span><div><b>${esc(x.name)}</b><small>${stateLabel(x.status)}</small></div><span class="pct">${Number(x.progress_percent||0)}%</span></div>`).join(''):'<div class="empty">Этапы появятся после публикации инженером.</div>'}</div>`}
function photos(){if(!data.project)return noProject();return hero()+`<div class="section"><h2>Фотоотчёт</h2><span>${data.media.length}</span></div>${data.media.length?`<div class="grid">${data.media.map(x=>`<article class="photo"><img src="${esc(x.media_url)}" alt="Фото объекта" loading="lazy"><div><b>${esc(x.title||x.stage||'Фото объекта')}</b><small>${esc(x.stage||'')}</small></div></article>`).join('')}</div>`:'<div class="empty"><b>Фото пока не опубликованы</b>Здесь будут только те фотографии, которые инженер открыл для заказчика.</div>'}`}
function docs(){if(!data.project)return noProject();return hero()+`<div class="section"><h2>Документы</h2><span>${data.documents.length}</span></div><div class="card">${data.documents.length?data.documents.map(x=>`<div class="doc"><div><b>${esc(x.title)}</b><small>${esc(x.document_type||'Документ')}</small></div><a href="${esc(x.document_url)}" target="_blank" rel="noopener">Открыть</a></div>`).join(''):'<div class="empty"><b>Документов пока нет</b>Проект, сметы и акты появятся после публикации инженером.</div>'}</div>`}
function render(){const names={home:'Главная',stages:'Этапы',photos:'Фото',docs:'Документы'};$('who').textContent=(data.user?.first_name||data.client?.name||'Заказчик')+(preview?' · DEMO':'');$('home').innerHTML=home();$('stages').innerHTML=stages();$('photos').innerHTML=photos();$('docs').innerHTML=docs();document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===screen));$('tabs').innerHTML=[['home','⌂'],['stages','✓'],['photos','▣'],['docs','▤']].map(([id,ic])=>`<button class="tab ${screen===id?'on':''}" data-go="${id}"><b>${ic}</b>${names[id]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{screen=b.dataset.go;render()})}
async function boot(){if(preview){data=demo;$('notice').innerHTML='<div class="notice">Демо-просмотр. В Telegram кабинет показывает только объект привязанного заказчика.</div>';render();return}try{const r=await fetch('/api/client-bootstrap.php',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Ошибка');data=d;render()}catch(e){$('notice').innerHTML='<div class="notice">Не удалось загрузить кабинет. Откройте его заново из бота Timchenko.pro.</div>';data={user:{first_name:'Заказчик'},client:null,project:null,stages:[],media:[],documents:[]};render()}}
boot();
})();
</script>
</body></html>
