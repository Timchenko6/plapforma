<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>Timchenko.pro — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f2f4f7;--card:#fff;--text:#101722;--muted:#6d7786;--line:rgba(15,27,45,.10);--navy:#0b1530;--gold:#b88a00;--good:#237a51;--soft:#eef1f5;--r:18px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#08111f;--card:#101a2b;--text:#f3f6fb;--muted:#97a4b8;--line:rgba(255,255,255,.10);--soft:#17243a;--navy:#e9eef7;--gold:#d6aa2c}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}button,select,a{font:inherit}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 14px}.brand{font-weight:900;font-size:20px;letter-spacing:-.03em}.brand b{color:var(--gold)}.sub{font-size:10px;color:var(--muted);margin-top:2px}.refresh{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:9px 11px}.hero{background:linear-gradient(145deg,#0b1530,#20375e);color:#fff;border-radius:23px;padding:19px;margin-bottom:11px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#ddc15d;font-weight:800}.hero h1{margin:6px 0;font-size:27px;line-height:1.08;letter-spacing:-.04em}.hero p{margin:0;color:#c2cedd;font-size:12px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{font-size:10px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}.select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px;margin-top:12px}.grid{display:grid;gap:9px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.metric,.card,.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}.metric{padding:13px}.metric small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}.metric b{display:block;margin-top:5px;font-size:18px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 2px 8px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:10px;color:var(--muted)}.list{display:grid;gap:7px}.row{padding:12px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.row strong{display:block;font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{font-size:9px;padding:5px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}.bar{height:8px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;margin-top:15px}.bar i{display:block;height:100%;background:#d6aa2c}.file{color:inherit;text-decoration:none}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo{position:relative;aspect-ratio:1.25;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}.photo img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;inset:auto 0 0;padding:20px 8px 7px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:10px}.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:11px}.profile{padding:16px}.profile h2{margin:4px 0;font-size:21px}.profile p{margin:4px 0;color:var(--muted);font-size:12px}.verified{color:var(--good);font-weight:800}.tabs{position:fixed;z-index:20;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(744px,calc(100% - 16px));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;background:rgba(11,21,48,.96);border-radius:18px}.tab{border:0;background:transparent;color:#9dacbf;border-radius:11px;padding:7px 2px;font-size:8px}.tab b{font-size:16px;display:block;margin-bottom:2px}.tab.on{color:#fff;background:rgba(255,255,255,.11)}.view{display:none}.view.on{display:block}.loader{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px}.error b{display:block;color:var(--text);margin-bottom:7px}@media(min-width:600px){.g2{grid-template-columns:repeat(4,1fr)}.gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="app"><div id="loader" class="loader">Загружаю личный кабинет…</div><div id="content" hidden>
<div class="top"><div><div class="brand">Timchenko<b>.pro</b></div><div class="sub">Личный кабинет клиента</div></div><button class="refresh" id="refresh">Обновить</button></div>
<section class="view on" data-view="object" id="object"></section>
<section class="view" data-view="estimate" id="estimate"></section>
<section class="view" data-view="docs" id="docs"></section>
<section class="view" data-view="photos" id="photos"></section>
<section class="view" data-view="profile" id="profile"></section>
</div></main>
<nav class="tabs" id="tabs" hidden>
<button class="tab on" data-go="object"><b>🏗</b>Объект</button><button class="tab" data-go="estimate"><b>₽</b>Сметы</button><button class="tab" data-go="docs"><b>📄</b>Документы</button><button class="tab" data-go="photos"><b>📷</b>Фото</button><button class="tab" data-go="profile"><b>👤</b>Профиль</button>
</nav>
<script>
const API='https://zzeeqwrndhpqdxyzpsqo.supabase.co/functions/v1/client-portal';
const token=new URLSearchParams(location.search).get('token')||'';const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0b1530')}catch(e){}
const S={data:null,i:0};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString('ru-RU')+' ₽';const dt=v=>v?new Date(v).toLocaleDateString('ru-RU'):'—';
const st=s=>({lead:'Заявка',survey:'Исходные данные',design:'Проектирование',estimate:'Смета',approved:'Согласовано',procurement:'Комплектация',installation:'Монтаж',commissioning:'Пусконаладка',completed:'Завершён',paused:'Пауза',cancelled:'Отменён',new:'Новый',draft:'Черновик',issued:'Выдан',signed:'Подписан'}[s]||s||'—');
const qn=s=>({water_node:'Узел ввода воды',engineering:'Инженерные системы',electric:'Электрика',engineering_nodes:'Узел ввода воды',home_engineering:'Инженерные системы',electrical:'Электрика'}[s]||s);
function p(){return S.data?.projects?.[S.i]||null}function projectSelect(){let a=S.data?.projects||[];if(a.length<2)return'';return `<select class="select" id="ps">${a.map((x,i)=>`<option value="${i}" ${i===S.i?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}
function quizzes(){let a=S.data?.quizzes||[];return `<div class="section"><div class="section-head"><h2>Расчёты КП</h2><span>${a.length}</span></div>${a.length?`<div class="list">${a.map(x=>`<div class="row"><div><strong>${esc(qn(x.quiz_type))}</strong><small>${dt(x.created_at)}</small></div><span class="pill">${x.project_id?'В объекте':'Сохранён'}</span></div>`).join('')}</div>`:'<div class="empty">Расчётов пока нет.</div>'}</div>`}
function objectView(){let x=p(),el=$('#object');if(!x){el.innerHTML=`<div class="hero"><div class="eyebrow">Мой объект</div><h1>Объект пока не создан</h1><p>Ваш профиль уже создан. Когда объект будет добавлен по вашему подтверждённому номеру телефона, он появится здесь автоматически.</p></div>${quizzes()}`;return}let stages=x.stages||[];el.innerHTML=`<div class="hero"><div class="eyebrow">Мой объект</div><h1>${esc(x.title)}</h1><p>${esc(x.current_stage||st(x.status))}</p><div class="chips">${x.area_m2?`<span class="chip">${esc(x.area_m2)} м²</span>`:''}${x.city?`<span class="chip">${esc(x.city)}</span>`:''}<span class="chip">${esc(st(x.status))}</span></div>${projectSelect()}<div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(x.progress_percent||0)))}%"></i></div></div><div class="grid g2"><div class="metric"><small>Готовность</small><b>${Number(x.progress_percent||0)}%</b></div><div class="metric"><small>Этап</small><b>${esc(x.current_stage||'—')}</b></div><div class="metric"><small>Бюджет</small><b>${x.budget_estimate?money(x.budget_estimate):'—'}</b></div><div class="metric"><small>Оплачено</small><b>${x.paid_amount?money(x.paid_amount):'—'}</b></div></div><div class="section"><div class="section-head"><h2>Этапы работ</h2><span>${stages.length}</span></div>${stages.length?`<div class="list">${stages.map(s=>`<div class="row"><div><strong>${esc(s.name)}</strong><small>${esc(s.system||'')}${s.planned_finish?' · до '+dt(s.planned_finish):''}</small></div><span class="pill">${Number(s.progress_percent||0)}%</span></div>`).join('')}</div>`:'<div class="empty">Этапы появятся после планирования.</div>'}</div>${quizzes()}`;$('#ps')?.addEventListener('change',e=>{S.i=Number(e.target.value);render()})}
function estimateView(){let x=p(),el=$('#estimate');if(!x){el.innerHTML='<div class="empty">Сметы появятся после создания объекта.</div>';return}let es=x.estimates||[],pay=x.payments||[];el.innerHTML=`<div class="section-head"><h2>Сметы</h2><span>${esc(x.title)}</span></div>${es.length?`<div class="list">${es.map(e=>{let t=Number(e.labor_total||0)+Number(e.mat_total||0)+Number(e.equipment_total||0)-Number(e.discount_total||0);return `<div class="row"><div><strong>${esc(e.title)}</strong><small>v${esc(e.version)} · ${esc(st(e.status))}</small></div><b>${money(t)}</b></div>`}).join('')}</div>`:'<div class="empty">Сметы пока не опубликованы.</div>'}<div class="section"><div class="section-head"><h2>Оплаты</h2><span>${pay.length}</span></div>${pay.length?`<div class="list">${pay.map(a=>`<div class="row"><div><strong>${money(a.amount)}</strong><small>${esc(a.note||a.payment_type||'')} · ${dt(a.paid_at||a.due_date||a.created_at)}</small></div><span class="pill">${esc(st(a.status))}</span></div>`).join('')}</div>`:'<div class="empty">Оплат пока нет.</div>'}</div>`}
function docRows(a,empty){return a.length?`<div class="list">${a.map(d=>`${d.url?`<a class="row file" href="${esc(d.url)}" target="_blank" rel="noopener">`:'<div class="row">'}<div><strong>${esc(d.title)}</strong><small>${esc(d.document_type)} · ${dt(d.updated_at||d.created_at)}</small></div><span class="pill">${d.url?'Открыть':esc(st(d.status))}</span>${d.url?'</a>':'</div>'}`).join('')}</div>`:`<div class="empty">${esc(empty)}</div>`}
function docsView(){let x=p(),pd=S.data?.profile_documents||[],el=$('#docs'),parts=[];if(pd.length)parts.push(`<div class="section-head"><h2>Переданные вами файлы</h2><span>${pd.length}</span></div>${docRows(pd,'')}`);if(x){let a=x.documents||[];parts.push(`<div class="section"><div class="section-head"><h2>Документы объекта</h2><span>${a.length}</span></div>${docRows(a,'Документы объекта пока не опубликованы.')}</div>`)}else if(!pd.length)parts.push('<div class="empty">Документов пока нет. Планы и дизайн-проекты можно отправить через раздел «Заказать проектирование» в боте.</div>');el.innerHTML=parts.join('')}
function photosView(){let x=p(),el=$('#photos');if(!x){el.innerHTML='<div class="empty">Фото появятся после создания объекта.</div>';return}let a=(x.media||[]).filter(z=>z.url);el.innerHTML=`<div class="section-head"><h2>Фото с объекта</h2><span>${a.length}</span></div>${a.length?`<div class="gallery">${a.map(z=>`<a class="photo" href="${esc(z.url)}" target="_blank"><img src="${esc(z.url)}" loading="lazy">${z.caption?`<div class="caption">${esc(z.caption)}</div>`:''}</a>`).join('')}</div>`:'<div class="empty">Фотоотчётов пока нет.</div>'}`}
function profileView(){let u=S.data?.profile||{},id=S.data?.identity||{},a=S.data?.projects||[];$('#profile').innerHTML=`<div class="card profile"><div class="eyebrow">Профиль клиента</div><h2>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Клиент')}</h2><p>${esc(u.phone||'Телефон не указан')} ${id.phone_verified?'<span class="verified">✓ подтверждён</span>':''}</p><p>${esc(u.city||'Город не указан')}</p><p>${id.project_lookup==='verified_phone'?'Объекты привязаны к вашему подтверждённому номеру телефона.':'Для поиска объектов по номеру подтвердите телефон в Telegram-боте.'}</p></div><div class="section"><div class="section-head"><h2>Мои объекты</h2><span>${a.length}</span></div>${a.length?`<div class="list">${a.map((x,i)=>`<button class="row" style="width:100%;text-align:left;color:inherit" data-pi="${i}"><div><strong>${esc(x.title)}</strong><small>${esc(x.city||'')} · ${Number(x.progress_percent||0)}%</small></div><span class="pill">Открыть</span></button>`).join('')}</div>`:'<div class="empty">Активных объектов пока нет.</div>'}</div>${quizzes()}`;document.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{S.i=Number(b.dataset.pi);go('object')})}
function render(){objectView();estimateView();docsView();photosView();profileView()}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.dataset.view===v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.go===v));scrollTo({top:0,behavior:'smooth'});render();tg?.HapticFeedback?.selectionChanged()}
async function load(){if(!token){fail('Нет доступа','Откройте «Мой объект» из Telegram-бота Timchenko.pro.');return}$('#loader').textContent='Загружаю личный кабинет…';try{let r=await fetch(`${API}?token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');S.data=d;if(S.i>=d.projects.length)S.i=0;render();$('#loader').hidden=true;$('#content').hidden=false;$('#tabs').hidden=false}catch(e){fail('Не удалось открыть кабинет',e.message==='expired_or_invalid_token'?'Ссылка устарела. Вернитесь в бот и снова нажмите «Мой объект».':'Попробуйте открыть кабинет из бота ещё раз.')}}
function fail(a,b){$('#content').hidden=true;$('#tabs').hidden=true;$('#loader').hidden=false;$('#loader').innerHTML=`<div class="error"><b>${esc(a)}</b>${esc(b)}</div>`}
$('#refresh').onclick=load;$('#tabs').onclick=e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};load();
</script>
</body></html>
